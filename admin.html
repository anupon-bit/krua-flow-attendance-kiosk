<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Krua Flow Attendance Admin</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#17191f;--muted:#6d7480;--line:#d9dee8;--blue:#2865ee;--green:#087a3d;--red:#9b2b23}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}button,input{font:inherit}.wrap{max-width:1120px;margin:auto;padding:20px}.head,.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.head{justify-content:space-between;margin-bottom:18px}.brand{font-size:32px;font-weight:950}.sub{color:var(--muted);font-weight:750}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:20px;margin-bottom:18px}.card h2{margin:0 0 14px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}.field label{display:block;font-weight:850;margin:0 0 7px}.input{width:100%;min-height:52px;border:1px solid #cfd5df;border-radius:14px;padding:0 14px;font-size:18px}.pin{text-align:center;letter-spacing:.28em;font-weight:900}.btn{border:0;border-radius:13px;min-height:48px;padding:0 16px;font-weight:900;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf1f7}.danger{background:#fde9e7;color:var(--red)}.success{background:#e8f7ef;color:var(--green)}.login{max-width:650px;margin:40px auto}.login .btn{width:100%;min-height:58px}.msg{display:none;margin-top:10px;padding:11px;border-radius:12px;font-weight:800}.msg.show{display:block}.err{background:#fff0ee;color:#93241d}.ok{background:#eaf8ef;color:#086b38}#dash{display:none}.empList{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.emp{border:1px solid var(--line);border-radius:17px;padding:15px;background:#fbfcff}.empName{font-size:20px;font-weight:950}.meta{font-size:14px;color:var(--muted);font-weight:750}.chip{font-size:13px;font-weight:900;border-radius:99px;padding:5px 9px}.on{background:#e8f7ef;color:#08703a}.off{background:#f1f2f5;color:#666}.empTools{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:12px}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:15px}.table{width:100%;border-collapse:collapse;min-width:720px}.table th,.table td{padding:11px;border-bottom:1px solid #e7eaf0;text-align:left}.table th{background:#f5f7fb}.busy{display:none;position:fixed;inset:0;background:#0005;z-index:20;align-items:center;justify-content:center}.busy.show{display:flex}.busy>div{background:#fff;border-radius:18px;padding:22px;font-weight:900}.spacer{flex:1}a{color:#275ec7;font-weight:850}.status{font-size:14px;color:var(--muted)}@media(max-width:760px){.wrap{padding:12px}.grid2,.empList{grid-template-columns:1fr}.empTools{grid-template-columns:1fr}.head{align-items:flex-start}.brand{font-size:28px}.btn{width:100%}.row .btn{width:auto}}
</style></head><body>
<iframe name="sink" style="display:none"></iframe><div class="busy" id="busy"><div id="busyText">กำลังประมวลผล...</div></div>
<div class="wrap"><div class="head"><div><div class="brand">Krua Flow</div><div class="sub">Attendance Admin</div></div><div class="status" id="status">ยังไม่เชื่อมต่อ</div></div>
<section class="card login" id="login"><h2>เข้าสู่ระบบผู้ดูแล</h2><details id="apiBox"><summary><b>ตั้งค่า Web App URL</b></summary><div class="field" style="margin-top:12px"><label>Google Apps Script Web App URL</label><input class="input" id="apiUrl" type="url" placeholder="https://script.google.com/macros/s/.../exec"></div><div class="meta" style="margin-top:6px">ตั้งครั้งแรกครั้งเดียว ระบบจะจำ URL ในอุปกรณ์นี้</div></details><div class="field" style="margin-top:14px"><label>PIN Admin 6 หลัก</label><input class="input pin" id="adminPin" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></div><button class="btn primary" id="loginBtn" style="margin-top:14px">เข้าสู่ระบบ Admin</button><div class="msg err" id="loginErr"></div></section>
<main id="dash"><div class="row" style="margin-bottom:14px"><h2 style="margin:0">จัดการลงเวลาพนักงาน</h2><div class="spacer"></div><button class="btn secondary" id="refreshBtn">รีเฟรช</button><button class="btn secondary" id="sheetBtn">Google Sheet</button><button class="btn danger" id="logoutBtn">ออกจากระบบ</button></div>
<div class="grid2"><section class="card"><h2>เพิ่มพนักงาน</h2><div class="grid2"><div class="field"><label>รหัสพนักงาน</label><input class="input" id="newId" placeholder="E004"></div><div class="field"><label>ชื่อพนักงาน</label><input class="input" id="newName"></div><div class="field"><label>รหัสลงเวลา 4 หลัก</label><input class="input pin" id="newPin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div><div class="field"><label>ลำดับ</label><input class="input" id="newSort" type="number" value="99"></div></div><button class="btn primary" id="addBtn" style="margin-top:12px">เพิ่มพนักงาน</button><div class="msg err" id="addErr"></div><div class="msg ok" id="addOk"></div></section>
<section class="card"><h2>เปลี่ยน PIN Admin</h2><div class="field"><label>PIN ใหม่ 6 หลัก</label><input class="input pin" id="adminNew" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></div><div class="field" style="margin-top:10px"><label>ยืนยัน PIN ใหม่</label><input class="input pin" id="adminConfirm" type="password" inputmode="numeric" maxlength="6" placeholder="••••••"></div><button class="btn secondary" id="changeAdminBtn" style="margin-top:12px">เปลี่ยน PIN</button><div class="msg err" id="secErr"></div><div class="msg ok" id="secOk"></div></section></div>
<section class="card"><div class="row"><h2 style="margin:0">พนักงานและรหัสลงเวลา</h2><div class="spacer"></div><div class="meta" id="count"></div></div><div class="empList" id="emps" style="margin-top:14px"></div></section>
<section class="card"><div class="row"><h2 style="margin:0">รายการล่าสุด</h2><div class="spacer"></div><div class="meta">สูงสุด 100 รายการ</div></div><div class="tableWrap" style="margin-top:14px"><table class="table"><thead><tr><th>เวลา Server</th><th>พนักงาน</th><th>รายการ</th><th>รูป</th><th>สถานะ</th></tr></thead><tbody id="rows"></tbody></table></div></section></main></div>
<script>
(function(){
var $=function(id){return document.getElementById(id)},LS='kruaFlowApiUrlV4',SS='kruaFlowAdminTokenV4',state={api:'',token:'',sheet:''};
function only(v,n){return String(v||'').replace(/\D/g,'').slice(0,n)}
function uid(){return crypto.randomUUID?crypto.randomUUID():'r-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function setMsg(id,msg){var e=$(id);e.textContent=msg||'';e.classList.toggle('show',!!msg)}
function busy(on,msg){$('busyText').textContent=msg||'กำลังประมวลผล...';$('busy').classList.toggle('show',!!on)}
function apiUrl(v){v=String(v||'').trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(v))throw new Error('กรุณาใช้ Web App URL ที่ลงท้าย /exec');return v.split('?')[0]}
function call(p){return new Promise(function(resolve,reject){var id=uid();p.requestId=id;var f=document.createElement('form');f.method='POST';f.action=state.api;f.target='sink';f.style.display='none';var i=document.createElement('input');i.type='hidden';i.name='payload';i.value=JSON.stringify(p);f.appendChild(i);document.body.appendChild(f);try{f.submit()}catch(e){f.remove();reject(e);return}setTimeout(function(){f.remove()},5000);poll(id,resolve,reject,0)})}
function poll(id,resolve,reject,n){if(n>28){reject(new Error('Backend ไม่ตอบสนอง'));return}var cb='__kfa_'+id.replace(/[^A-Za-z0-9_]/g,'_')+'_'+n,s=document.createElement('script'),done=false;function clean(){done=true;try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()}window[cb]=function(r){clean();if(!r||!r.ready){setTimeout(function(){poll(id,resolve,reject,n+1)},500);return}if(r.ok)resolve(r.data||{});else reject(new Error(r.error||'ทำรายการไม่สำเร็จ'))};s.onerror=function(){clean();setTimeout(function(){poll(id,resolve,reject,n+1)},650)};s.src=state.api+'?api=status&requestId='+encodeURIComponent(id)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.body.appendChild(s);setTimeout(function(){if(!done){clean();setTimeout(function(){poll(id,resolve,reject,n+1)},650)}},4000)}
async function login(){setMsg('loginErr','');try{state.api=apiUrl($('apiUrl').value||localStorage.getItem(LS)||'');var pin=only($('adminPin').value,6);if(pin.length!==6)throw new Error('กรุณากรอก PIN Admin 6 หลัก');busy(1,'กำลังเข้าสู่ระบบ...');var r=await call({op:'adminLogin',adminPin:pin});state.token=r.token||'';if(!state.token)throw new Error('ไม่ได้รับ Admin Token');localStorage.setItem(LS,state.api);sessionStorage.setItem(SS,state.token);$('adminPin').value='';await load();$('login').style.display='none';$('dash').style.display='block';$('status').textContent='เชื่อมต่อ Backend แล้ว'}catch(e){setMsg('loginErr',e.message||String(e));$('status').textContent='เชื่อมต่อไม่สำเร็จ'}finally{busy(0)}}
async function load(){busy(1,'กำลังโหลดข้อมูล...');try{var r=await call({op:'adminDashboard',adminToken:state.token});state.sheet=r.sheetUrl||'';renderEmps(r.employees||[]);renderRows(r.attendance||[]);$('status').textContent='เชื่อมต่อ Backend แล้ว'}catch(e){if(/หมดอายุ|Admin|สิทธิ์/.test(e.message||'')){sessionStorage.removeItem(SS);state.token='';$('dash').style.display='none';$('login').style.display='block'}throw e}finally{busy(0)}}
function renderEmps(a){$('count').textContent=a.length+' คน';var h=$('emps');h.innerHTML='';if(!a.length){h.innerHTML='<div class="meta">ยังไม่มีพนักงาน</div>';return}a.forEach(function(e){var d=document.createElement('div');d.className='emp';d.innerHTML='<div class="row"><div><div class="empName"></div><div class="meta empId"></div></div><div class="spacer"></div><span class="chip '+(e.active?'on':'off')+'">'+(e.active?'ใช้งาน':'ปิดใช้งาน')+'</span></div><div class="meta" style="margin-top:8px">'+(e.pinSet?'ตั้งรหัสแล้ว':'ยังไม่มีรหัส')+' • ลำดับ '+(Number(e.sort)||999)+'</div><div class="empTools"><input class="input pin p" type="password" inputmode="numeric" maxlength="4" placeholder="รหัสใหม่ 4 หลัก"><button class="btn secondary sp">'+(e.pinSet?'เปลี่ยนรหัส':'ตั้งรหัส')+'</button></div><button class="btn '+(e.active?'danger':'success')+' tg" style="margin-top:10px">'+(e.active?'ปิดใช้งาน':'เปิดใช้งาน')+'</button>';d.querySelector('.empName').textContent=e.name;d.querySelector('.empId').textContent=e.id;var p=d.querySelector('.p');p.oninput=function(){p.value=only(p.value,4)};d.querySelector('.sp').onclick=async function(){var pin=only(p.value,4);if(pin.length!==4){alert('กรุณากรอกรหัส 4 หลัก');return}try{busy(1,'กำลังบันทึกรหัส...');await call({op:'adminSetEmployeePin',adminToken:state.token,employeeId:e.id,newPin:pin});await load()}catch(x){alert(x.message||String(x))}finally{busy(0)}};d.querySelector('.tg').onclick=async function(){if(!confirm((e.active?'ปิด':'เปิด')+'การใช้งาน '+e.name+' ?'))return;try{busy(1,'กำลังอัปเดต...');await call({op:'adminSetEmployeeActive',adminToken:state.token,employeeId:e.id,active:!e.active});await load()}catch(x){alert(x.message||String(x))}finally{busy(0)}};h.appendChild(d)})}
function renderRows(a){var b=$('rows');b.innerHTML='';if(!a.length){b.innerHTML='<tr><td colspan="5" class="meta">ยังไม่มีรายการ</td></tr>';return}a.forEach(function(r){var tr=document.createElement('tr'),vals=[r.timestamp||((r.date||'')+' '+(r.time||'')).trim(),(r.employeeName||'')+(r.employeeId?' ('+r.employeeId+')':''),r.action||'',r.photoUrl?'รูป':'-',r.status||''];vals.forEach(function(v,i){var td=document.createElement('td');if(i===3&&r.photoUrl){var a=document.createElement('a');a.href=r.photoUrl;a.target='_blank';a.rel='noopener';a.textContent='เปิดรูป';td.appendChild(a)}else td.textContent=v;tr.appendChild(td)});b.appendChild(tr)})}
$('loginBtn').onclick=login;$('adminPin').onkeydown=function(e){if(e.key==='Enter')login()};$('refreshBtn').onclick=function(){load().catch(function(e){alert(e.message||String(e))})};$('sheetBtn').onclick=function(){if(state.sheet)window.open(state.sheet,'_blank','noopener')};$('logoutBtn').onclick=async function(){try{await call({op:'adminLogout',adminToken:state.token})}catch(e){}sessionStorage.removeItem(SS);state.token='';$('dash').style.display='none';$('login').style.display='block';$('status').textContent='ออกจากระบบแล้ว'};
$('addBtn').onclick=async function(){setMsg('addErr','');setMsg('addOk','');try{var e={id:String($('newId').value||'').trim(),name:String($('newName').value||'').trim(),pin:only($('newPin').value,4),sort:Number($('newSort').value)||99};if(!e.id||!e.name)throw new Error('กรอกรหัสและชื่อพนักงาน');if(e.pin.length!==4)throw new Error('รหัสลงเวลาต้องเป็นตัวเลข 4 หลัก');busy(1,'กำลังเพิ่มพนักงาน...');await call({op:'adminAddEmployee',adminToken:state.token,employee:e});$('newId').value='';$('newName').value='';$('newPin').value='';$('newSort').value='99';setMsg('addOk','เพิ่มพนักงานเรียบร้อย');await load()}catch(x){setMsg('addErr',x.message||String(x))}finally{busy(0)}};
$('changeAdminBtn').onclick=async function(){setMsg('secErr','');setMsg('secOk','');try{var a=only($('adminNew').value,6),b=only($('adminConfirm').value,6);if(a.length!==6)throw new Error('PIN Admin ต้องเป็นตัวเลข 6 หลัก');if(a!==b)throw new Error('PIN ที่ยืนยันไม่ตรงกัน');if(!confirm('ยืนยันเปลี่ยน PIN Admin ?'))return;busy(1,'กำลังเปลี่ยน PIN...');await call({op:'adminChangePin',adminToken:state.token,newPin:a});$('adminNew').value='';$('adminConfirm').value='';setMsg('secOk','เปลี่ยน PIN Admin เรียบร้อย')}catch(x){setMsg('secErr',x.message||String(x))}finally{busy(0)}};
['adminPin','newPin','adminNew','adminConfirm'].forEach(function(id){$(id).oninput=function(){$(id).value=only($(id).value,id==='newPin'?4:6)}});state.api=localStorage.getItem(LS)||'';$('apiUrl').value=state.api;if(!state.api)$('apiBox').open=true;state.token=sessionStorage.getItem(SS)||'';if(state.api&&state.token){try{state.api=apiUrl(state.api);load().then(function(){$('login').style.display='none';$('dash').style.display='block'}).catch(function(){sessionStorage.removeItem(SS);state.token=''})}catch(e){}}
})();
</script></body></html>

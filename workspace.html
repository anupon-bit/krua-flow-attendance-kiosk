<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>KruaFlow Workforce</title>
  <script src="./config.js"></script>
  <script src="./mock-data.js"></script>

  <script src="./js/i18n.js"></script>
  <style>
    :root{--bg:#f4f7f5;--paper:#fff;--ink:#172a3a;--muted:#667784;--line:#dbe5df;--brand:#0e7655;--brandDark:#07563d;--brandSoft:#e7f4ed;--danger:#a83232;--warning:#a15c00;font-family:"Noto Sans Thai","Leelawadee UI",system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}
    *{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--ink)}button,input{font:inherit}.shell{height:100vh;display:grid;grid-template-columns:268px 1fr;overflow:hidden}.shell.collapsed{grid-template-columns:78px 1fr}.sidebar{height:100vh;display:flex;flex-direction:column;min-width:0;min-height:0;overflow:hidden;border-right:1px solid var(--line);background:var(--paper);transition:.2s}.brand{display:flex;align-items:center;gap:10px;padding:17px 14px 12px}.brandMark{width:42px;height:42px;display:grid;place-items:center;flex:0 0 auto;border-radius:13px;background:linear-gradient(135deg,var(--brandDark),#1a9c73);color:#fff;font-weight:1000}.brandText{min-width:0}.brandName{font-size:20px;font-weight:1000;color:var(--brandDark)}.brandSub{font-size:11px;color:var(--muted);font-weight:800}.collapseBtn{width:36px;height:36px;margin-left:auto;border:0;border-radius:10px;background:#edf3ef;color:#35584b;font-weight:1000;cursor:pointer}.nav{flex:1 1 auto;min-height:0;overflow:auto;padding:4px 10px 22px;scrollbar-gutter:stable}.group{margin-top:11px}.groupTitle{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:7px 11px;border-radius:8px;color:#87958e;font-size:11px;font-weight:950;letter-spacing:.05em;text-transform:uppercase;cursor:pointer;user-select:none}.groupTitle:hover{background:#f5f8f6}.groupTitle::after{content:'⌄';font-size:14px;transition:transform .18s}.group.collapsed .groupTitle::after{transform:rotate(-90deg)}.group.collapsed>.navBtn{display:none}.navBtn{width:100%;display:flex;align-items:center;gap:10px;margin:2px 0;padding:10px 11px;border:0;border-radius:11px;background:transparent;color:#29483d;text-align:left;font-weight:850;cursor:pointer}.navBtn:hover{background:#f0f6f2}.navBtn.active{background:var(--brandSoft);color:var(--brandDark)}.ico{width:25px;flex:0 0 25px;text-align:center;font-size:17px}.navLabel{white-space:nowrap}.shell.collapsed .brandText,.shell.collapsed .groupTitle,.shell.collapsed .navLabel{display:none}.shell.collapsed .brand{justify-content:center;padding-inline:8px;flex-wrap:wrap}.shell.collapsed .collapseBtn{margin:0}.shell.collapsed .navBtn{justify-content:center;padding-inline:8px}.main{min-width:0;display:grid;grid-template-rows:66px 1fr}.topbar{display:flex;align-items:center;gap:9px;padding:0 16px;border-bottom:1px solid var(--line);background:var(--paper)}.pageTitle{font-size:18px;font-weight:1000}.spacer{flex:1}.topBtn{min-height:40px;padding:0 12px;border:1px solid var(--line);border-radius:10px;background:#fff;color:#35584b;font-weight:850;cursor:pointer}.topBtn:hover{border-color:var(--brand)}.dangerBtn{color:var(--danger)}.frameWrap{min-height:0;background:var(--bg)}iframe{width:100%;height:100%;border:0;background:var(--bg)}.mobileMenu{display:none}.languageSwitch{display:inline-flex;padding:3px;border:1px solid var(--line);border-radius:12px;background:#fff}.languageSwitch button{min-width:39px;padding:6px 8px;border:0;border-radius:9px;background:transparent;color:var(--muted);font-weight:800;cursor:pointer}.languageSwitch button.active{background:var(--ink);color:#fff}.auth{position:fixed;inset:0;z-index:100;display:grid;place-items:center;padding:20px;background:rgba(244,247,245,.97)}.auth.hidden{display:none}.authCard{width:min(480px,100%);padding:26px;border:1px solid var(--line);border-radius:20px;background:#fff;box-shadow:0 24px 70px rgba(23,42,58,.13)}.authTop{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.authTitle{font-size:25px;font-weight:1000}.authSub{margin:5px 0 20px;color:var(--muted);font-weight:700;line-height:1.5}.field label{display:block;margin-bottom:7px;font-weight:900}.input{width:100%;min-height:52px;padding:0 14px;border:1px solid #cbd7d0;border-radius:12px;font-size:20px;text-align:center;letter-spacing:.2em}.loginBtn{width:100%;min-height:52px;margin-top:12px;border:0;border-radius:12px;background:var(--brand);color:#fff;font-weight:1000;cursor:pointer}.loginBtn:disabled{opacity:.55;cursor:wait}.authErr{display:none;margin-top:10px;padding:11px;border-radius:10px;background:#ffeded;color:var(--danger);font-weight:800}.authErr.show{display:block}.busyText{min-height:22px;margin-top:10px;color:var(--muted);font-size:13px;font-weight:750}.uatTag{display:inline-flex;align-items:center;min-height:28px;padding:4px 9px;border:1px solid #9bc9b8;border-radius:999px;background:var(--brandSoft);color:var(--brandDark);font-size:11px;font-weight:900}
    @media(max-width:920px){.shell,.shell.collapsed{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;z-index:30;width:min(300px,88vw);height:100dvh;transform:translateX(-102%);box-shadow:0 12px 40px rgba(0,0,0,.16)}.shell.menuOpen .sidebar{transform:translateX(0)}.shell.collapsed .brandText,.shell.collapsed .groupTitle,.shell.collapsed .navLabel{display:block}.shell.collapsed .navBtn{justify-content:flex-start;padding:10px 11px}.collapseBtn{display:none}.mobileMenu{display:inline-flex}.main{grid-column:1}.topbar{padding:0 10px}.pageTitle{font-size:15px}.topBtn span{display:none}}
  </style>

          <button class="navBtn" data-view="report-attendance" data-url="./workforce.html?embed=1&view=report-attendance" data-title-key="view.reportAttendance"><span class="ico">◷</span><span class="navLabel" data-i18n="view.reportAttendance">Attendance</span></button>

<script>
(function () {
  'use strict';
  const I18N = window.KruaFlowI18n;
  const api = new KruaFlowApi.Client({ timeout: 30000 });
  const shell = document.getElementById('shell');
  const frame = document.getElementById('contentFrame');
  const title = document.getElementById('pageTitle');
  const auth = document.getElementById('auth');
  const errorBox = document.getElementById('authErr');
  const buttons = Array.from(document.querySelectorAll('.navBtn[data-url]'));
  const SS = 'kruaFlowAdminTokenV4';
  const LS = 'kruaFlowAdminTokenPersistentV1';
  const EXP = 'kruaFlowAdminTokenPersistentExpV1';
  const KEY_VIEW = 'kfOwnerWorkspaceViewV1';
  const KEY_COLLAPSE = 'kfOwnerWorkspaceCollapsedV1';
  const KEY_GROUPS = 'kfOwnerWorkspaceGroupsV2';
  const isStaging = new URLSearchParams(location.search).get('staging') === '1';

  function getToken() {
    const session = sessionStorage.getItem(SS) || '';
    if (session) return session;
    const persisted = localStorage.getItem(LS) || '';
    const expiry = Number(localStorage.getItem(EXP) || 0);
    if (persisted && expiry > Date.now()) { sessionStorage.setItem(SS, persisted); return persisted; }
    return '';
  }

  function saveToken(value) {
    const expiry = Date.now() + 8 * 60 * 60 * 1000;
    sessionStorage.setItem(SS, value);
    localStorage.setItem(LS, value);
    localStorage.setItem(EXP, String(expiry));
  }

  function clearToken() {
    sessionStorage.removeItem(SS);
    localStorage.removeItem(LS);
    localStorage.removeItem(EXP);
  }

  function environmentUrl(raw) {
    if (!isStaging) return raw || '';
    const url = new URL(raw || '', location.href);
    url.searchParams.set('staging', '1');
    return url.href;
  }

  function sendAdminSession() {
    const value = getToken();
    if (!value) return;
    try { frame.contentWindow.postMessage({ type: 'KruaFlowAdminSession', token: value }, location.origin); } catch (_) {}
  }

  function openView(button, persist) {
    if (!button) return;
    buttons.forEach(function (item) { item.classList.toggle('active', item === button); });
    frame.src = environmentUrl(button.dataset.url || '');
    title.textContent = I18N.t(button.dataset.titleKey || 'app.name');
    if (persist !== false) localStorage.setItem(KEY_VIEW, button.dataset.view || 'overview');
    shell.classList.remove('menuOpen');
  }

  function refreshLanguage() {
    I18N.apply(document);
    const active = document.querySelector('.navBtn.active');
    if (active) title.textContent = I18N.t(active.dataset.titleKey || 'app.name');
    document.title = I18N.t('app.name');
  }

  function startWorkspace() {
    auth.classList.add('hidden');
    const requested = new URLSearchParams(location.search).get('view');
    const selected = requested || localStorage.getItem(KEY_VIEW) || 'overview';
    openView(buttons.find(function (button) { return button.dataset.view === selected; }) || buttons[0], false);
  }

  async function login() {
    errorBox.classList.remove('show');
    const pin = document.getElementById('adminPin').value.replace(/\D/g, '').slice(0, 6);
    if (pin.length !== 6) { errorBox.textContent = I18N.t('auth.missingPin'); errorBox.classList.add('show'); return; }
    const button = document.getElementById('loginBtn');
    button.disabled = true;
    document.getElementById('busyText').textContent = I18N.t('common.loading');
    try {
      const result = await api.call({ op: 'adminLoginFast', adminPin: pin });
      const value = result.token || result.adminToken || result.sessionToken || '';
      if (!value) throw new Error(I18N.t('auth.failed'));
      saveToken(value);
      document.getElementById('adminPin').value = '';
      startWorkspace();
    } catch (error) {
      errorBox.textContent = error.message || I18N.t('auth.failed');
      errorBox.classList.add('show');
    } finally {
      button.disabled = false;
      document.getElementById('busyText').textContent = '';
    }
  }

  function loadGroupState() {
    let saved = {};
    try { saved = JSON.parse(localStorage.getItem(KEY_GROUPS) || '{}'); } catch (_) {}
    document.querySelectorAll('.group').forEach(function (group) {
      const key = group.dataset.group;
      const groupTitle = group.querySelector('.groupTitle');
      if (saved[key]) group.classList.add('collapsed');
      groupTitle.setAttribute('role', 'button');
      groupTitle.setAttribute('tabindex', '0');
      function toggle() {
        group.classList.toggle('collapsed');
        groupTitle.setAttribute('aria-expanded', String(!group.classList.contains('collapsed')));
        let state = {};
        try { state = JSON.parse(localStorage.getItem(KEY_GROUPS) || '{}'); } catch (_) {}
        state[key] = group.classList.contains('collapsed');
        localStorage.setItem(KEY_GROUPS, JSON.stringify(state));
      }
      groupTitle.onclick = toggle;
      groupTitle.onkeydown = function (event) { if (event.key === 'Enter' || event.key === ' ') { event.preventDefault(); toggle(); } };
      groupTitle.setAttribute('aria-expanded', String(!group.classList.contains('collapsed')));
    });
  }

  buttons.forEach(function (button) { button.onclick = function () { openView(button); }; });
  frame.addEventListener('load', function () { setTimeout(sendAdminSession, 30); try { frame.contentWindow.scrollTo(0, 0); } catch (_) {} });
  window.addEventListener('message', function (event) {
    if (event.origin !== location.origin || event.source !== frame.contentWindow) return;
    if ((event.data || {}).type === 'KruaFlowAdminSessionRequest') sendAdminSession();
  });
  window.addEventListener('KruaFlowLanguageChange', refreshLanguage);
  document.getElementById('loginBtn').onclick = login;
  document.getElementById('adminPin').onkeydown = function (event) { if (event.key === 'Enter') login(); };
  document.getElementById('collapseBtn').onclick = function () { shell.classList.toggle('collapsed'); localStorage.setItem(KEY_COLLAPSE, shell.classList.contains('collapsed') ? '1' : '0'); };
  document.getElementById('mobileMenu').onclick = function () { shell.classList.toggle('menuOpen'); };
  document.getElementById('openBtn').onclick = function () { window.open(frame.src, '_blank', 'noopener'); };
  document.getElementById('logoutBtn').onclick = function () { clearToken(); frame.src = 'about:blank'; auth.classList.remove('hidden'); };

  loadGroupState();
  I18N.bindLanguageSwitchers(document);
  refreshLanguage();
  if (localStorage.getItem(KEY_COLLAPSE) === '1') shell.classList.add('collapsed');
  if (getToken()) startWorkspace();
})();

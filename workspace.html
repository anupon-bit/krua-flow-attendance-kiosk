<html lang="th">
<head>
<meta charset="utf-8">

<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#16304b;--muted:#73839a;--line:#e1e8f0;--blue:#2474df;--warn:#b86a00;--red:#a63232}
*{box-sizing:border-box}html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Noto Sans Thai","Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button,input{font:inherit}.shell{height:100vh;display:grid;grid-template-columns:250px 1fr;overflow:hidden}.shell.collapsed{grid-template-columns:78px 1fr}
.sidebar{background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0;min-height:0;height:100vh;overflow:hidden;transition:.2s}.brand{display:flex;align-items:center;gap:10px;padding:18px 16px 12px;flex:0 0 auto}.brandMark{width:42px;height:42px;border-radius:13px;background:linear-gradient(135deg,#1769c5,#3e93ef);color:#fff;display:grid;place-items:center;font-weight:1000}.brandText{min-width:0}.brandName{font-size:22px;font-weight:1000;color:#0e5687}.brandSub{font-size:12px;color:var(--muted);font-weight:800}.collapseBtn{margin-left:auto;width:36px;height:36px;border:0;border-radius:10px;background:#eef3f8;color:#35516d;font-weight:1000;cursor:pointer}
.nav{flex:1 1 auto;min-height:0;overflow-y:auto;overflow-x:hidden;overscroll-behavior:contain;padding:4px 10px 22px;scrollbar-gutter:stable}.nav::-webkit-scrollbar{width:8px}.nav::-webkit-scrollbar-thumb{background:#d7e0ea;border-radius:999px}.nav::-webkit-scrollbar-track{background:transparent}.group{margin-top:12px}.groupTitle{font-size:11px;font-weight:950;color:#97a3b2;padding:7px 11px;text-transform:uppercase;letter-spacing:.04em;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer;user-select:none;border-radius:8px}.groupTitle:hover{background:#f5f8fb}.groupTitle::after{content:'⌄';font-size:14px;color:#8da0b3;transition:transform .18s}.group.collapsed .groupTitle::after{transform:rotate(-90deg)}.group.collapsed>.navBtn{display:none}.navBtn{width:100%;border:0;background:transparent;border-radius:11px;padding:11px 12px;display:flex;align-items:center;gap:11px;text-align:left;color:#294864;font-weight:900;cursor:pointer;margin:2px 0;text-decoration:none}.navBtn:hover{background:#f0f5fa}.navBtn.active{background:#e7f2ff;color:#145f9b}.ico{width:25px;text-align:center;font-size:18px;flex:0 0 25px}.navLabel{white-space:nowrap}.navNote{margin-left:auto;font-size:10px;padding:3px 6px;border-radius:999px;background:#fff1d8;color:var(--warn)}
.shell.collapsed .brandText,.shell.collapsed .groupTitle,.shell.collapsed .navLabel,.shell.collapsed .navNote{display:none}.shell.collapsed .brand{justify-content:center;padding-left:8px;padding-right:8px;flex-wrap:wrap}.shell.collapsed .collapseBtn{margin:0}.shell.collapsed .navBtn{justify-content:center;padding:12px 8px}
.main{min-width:0;display:grid;grid-template-rows:64px 1fr}.topbar{background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;padding:0 16px}.pageTitle{font-size:18px;font-weight:1000}.spacer{flex:1}.topBtn{border:1px solid var(--line);background:#fff;border-radius:10px;min-height:40px;padding:0 12px;font-weight:900;cursor:pointer;color:#35516d}.dangerBtn{color:var(--red)}.frameWrap{min-height:0;background:var(--bg)}iframe{width:100%;height:100%;border:0;background:var(--bg)}.mobileMenu{display:none}
.auth{position:fixed;inset:0;z-index:100;background:rgba(244,247,251,.96);display:grid;place-items:center;padding:20px}.auth.hidden{display:none}.authCard{width:min(480px,100%);background:#fff;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 24px 70px #173e6820}.authTitle{font-size:26px;font-weight:1000;margin-bottom:5px}.authSub{color:var(--muted);font-weight:800;margin-bottom:18px}.field label{display:block;font-weight:950;margin-bottom:7px}.input{width:100%;min-height:54px;border:1px solid #ccd7e3;border-radius:13px;padding:0 14px;font-size:20px;text-align:center;letter-spacing:.2em}.loginBtn{width:100%;min-height:54px;border:0;border-radius:13px;background:var(--blue);color:#fff;font-weight:1000;margin-top:12px;cursor:pointer}.authErr{display:none;margin-top:10px;padding:10px;border-radius:10px;background:#fff0f0;color:#a63232;font-weight:850}.authErr.show{display:block}.busy{display:none;position:fixed;inset:0;z-index:120;background:#0004;place-items:center}.busy.show{display:grid}.busyBox{background:#fff;border-radius:14px;padding:18px 24px;font-weight:950}
@media(max-width:820px){.shell,.shell.collapsed{grid-template-columns:1fr}.sidebar{position:fixed;inset:0 auto 0 0;width:min(290px,86vw);z-index:20;transform:translateX(-102%);box-shadow:0 12px 40px #0002}.shell.menuOpen .sidebar{transform:translateX(0)}.sidebar{height:100dvh}.shell.collapsed .brandText,.shell.collapsed .groupTitle,.shell.collapsed .navLabel,.shell.collapsed .navNote{display:block}.shell.collapsed .navBtn{justify-content:flex-start;padding:11px 12px}.mobileMenu{display:inline-flex}.collapseBtn{display:none}.main{grid-column:1}.topbar{padding:0 10px}.pageTitle{font-size:16px}}
</style>
</head>
<body>
<iframe name="apiSink" id="apiSink" style="display:none"></iframe>
<div class="busy" id="busy"><div class="busyBox" id="busyText">กำลังเข้าสู่ระบบ...</div></div>
<div class="auth" id="auth">
  <div class="authCard">
    <div class="authTitle">KruaFlow ศูนย์ควบคุม</div>

  <aside class="sidebar">

    <nav class="nav">

      <div class="group"><div class="groupTitle">สรรหา</div>
        <button class="navBtn" data-view="applicants" data-url="./workforce.html?embed=1&view=applicants" data-title="ผู้สมัครงาน"><span class="ico">◎</span><span class="navLabel">ผู้สมัครงาน</span></button>
        <button class="navBtn" data-view="interviews" data-url="./workforce.html?embed=1&view=interviews" data-title="นัดสัมภาษณ์"><span class="ico">◷</span><span class="navLabel">นัดสัมภาษณ์</span></button>
        <button class="navBtn" data-view="staffing" data-url="./workforce.html?embed=1&view=staffing" data-title="แผนรับพนักงาน"><span class="ico">▦</span><span class="navLabel">แผนรับพนักงาน</span></button>
      </div>
      <div class="group"><div class="groupTitle">พนักงาน</div>
        <button class="navBtn" data-view="employees" data-url="./admin.html?embed=1&view=employees" data-title="ภาพรวมพนักงาน"><span class="ico">👥</span><span class="navLabel">ภาพรวมพนักงาน</span></button>
        <button class="navBtn" data-view="onboarding" data-url="./workforce.html?embed=1&view=onboarding" data-title="Onboarding"><span class="ico">＋</span><span class="navLabel">Onboarding</span></button>
        <button class="navBtn" data-view="employee-documents" data-url="./admin.html?embed=1&view=employees" data-title="เอกสารพนักงาน"><span class="ico">▤</span><span class="navLabel">เอกสารพนักงาน</span><span class="navNote">เลือกพนักงาน</span></button>
      </div>
      <div class="group"><div class="groupTitle">การทำงาน</div>
        <button class="navBtn" data-view="schedule" data-url="./schedule.html?admin=1&embed=1" data-title="ตารางงาน"><span class="ico">▦</span><span class="navLabel">ตารางงาน</span></button>
        <button class="navBtn" data-view="attendance" data-url="./admin.html?embed=1&view=attendance" data-title="เวลาเข้าออก"><span class="ico">◷</span><span class="navLabel">เวลาเข้าออก</span></button>
        <button class="navBtn" data-view="leave" data-url="./admin.html?embed=1&view=leave" data-title="การลา / วันหยุด"><span class="ico">✓</span><span class="navLabel">การลา / วันหยุด</span></button>
        <button class="navBtn" data-view="activity" data-url="./workforce.html?embed=1&view=activity" data-title="Daily Activity"><span class="ico">▣</span><span class="navLabel">Daily Activity</span></button>
        <button class="navBtn" data-view="shift-check" data-url="./workforce.html?embed=1&view=shift-check" data-title="Daily Shift Check"><span class="ico">✓</span><span class="navLabel">Daily Shift Check</span></button>
      </div>
      <div class="group"><div class="groupTitle">ค่าแรง</div>
        <button class="navBtn" data-view="payroll" data-url="./dashboard.html?embed=1&view=payroll" data-title="ตรวจค่าแรง"><span class="ico">฿</span><span class="navLabel">ตรวจค่าแรง</span></button>
        <button class="navBtn" data-view="payroll-period" data-url="./dashboard.html?embed=1&view=payroll" data-title="รอบค่าแรง"><span class="ico">▤</span><span class="navLabel">รอบค่าแรง</span></button>
        <button class="navBtn" data-view="bank" data-url="./dashboard.html?embed=1&view=bank" data-title="เตรียมจ่าย"><span class="ico">▣</span><span class="navLabel">เตรียมจ่าย</span></button>
      </div>
      <div class="group"><div class="groupTitle">รายงาน</div>
        <button class="navBtn" data-view="reports" data-url="./workforce.html?embed=1&view=reports" data-title="รายงาน Workforce"><span class="ico">▤</span><span class="navLabel">Workforce / Recruitment</span></button>
        <button class="navBtn" data-view="performance" data-url="./workforce.html?embed=1&view=performance" data-title="Performance"><span class="ico">◇</span><span class="navLabel">Performance</span></button>
        <button class="navBtn" data-view="retention" data-url="./workforce.html?embed=1&view=retention" data-title="Retention"><span class="ico">↻</span><span class="navLabel">Retention</span></button>
      </div>
      <div class="group"><div class="groupTitle">ระบบ</div>
        <button class="navBtn" data-view="settings" data-url="./admin-settings.html?embed=1" data-title="ตั้งค่าระบบ"><span class="ico">⚙</span><span class="navLabel">ตั้งค่าระบบ</span></button>
        <button class="navBtn" data-view="permissions" data-url="./admin-settings.html?embed=1&view=permissions" data-title="สิทธิ์ผู้ใช้งาน"><span class="ico">♙</span><span class="navLabel">สิทธิ์ผู้ใช้งาน</span></button>
        <button class="navBtn" data-view="devices" data-url="./admin-settings.html?embed=1&view=devices" data-title="จัดการอุปกรณ์"><span class="ico">▣</span><span class="navLabel">จัดการอุปกรณ์</span></button>
        <button class="navBtn" data-view="readiness" data-url="./readiness.html?embed=1" data-title="เครื่องมือระบบ"><span class="ico">⚒</span><span class="navLabel">เครื่องมือระบบ</span></button>
      </div>
      <div class="group"><div class="groupTitle">ทางลัด</div>
        <button class="navBtn" data-external="./index.html"><span class="ico">↗</span><span class="navLabel">เปิดหน้าลงเวลา</span></button>
        <button class="navBtn" data-external="./portal.html"><span class="ico">↗</span><span class="navLabel">พื้นที่พนักงาน</span></button>
        <button class="navBtn" data-external="./manager.html"><span class="ico">↗</span><span class="navLabel">พื้นที่ผู้จัดการ</span></button>

      </div>
    </nav>
  </aside>
  <main class="main">
    <header class="topbar"><button class="topBtn mobileMenu" id="mobileMenu">☰</button><div class="pageTitle" id="pageTitle">ภาพรวมระบบ</div><div class="spacer"></div><button class="topBtn" id="reloadBtn">รีเฟรชหน้านี้</button><button class="topBtn" id="openBtn">เปิดเต็มหน้า</button><button class="topBtn dangerBtn" id="logoutBtn">ออกจากระบบ</button></header>
    <div class="frameWrap"><iframe id="contentFrame" title="KruaFlow Content" src="about:blank"></iframe></div>
  </main>
</div>
<script>
(()=>{
const shell=document.getElementById('shell'),frame=document.getElementById('contentFrame'),title=document.getElementById('pageTitle'),auth=document.getElementById('auth'),err=document.getElementById('authErr');
const buttons=[...document.querySelectorAll('.navBtn[data-url]')],SS='kruaFlowAdminTokenV4',LS='kruaFlowAdminTokenPersistentV1',EXP='kruaFlowAdminTokenPersistentExpV1',KEY_VIEW='kfOwnerWorkspaceViewV1',KEY_COLLAPSE='kfOwnerWorkspaceCollapsedV1',KEY_GROUPS='kfOwnerWorkspaceGroupsV1';
let api='',pending={};try{history.scrollRestoration='manual'}catch(e){}
function token(){const s=sessionStorage.getItem(SS)||'';if(s)return s;const p=localStorage.getItem(LS)||'',e=Number(localStorage.getItem(EXP)||0);if(p&&e>Date.now()){sessionStorage.setItem(SS,p);return p}return''}
function saveToken(t){const e=Date.now()+8*60*60*1000;sessionStorage.setItem(SS,t);localStorage.setItem(LS,t);localStorage.setItem(EXP,String(e))}
function clearToken(){sessionStorage.removeItem(SS);localStorage.removeItem(LS);localStorage.removeItem(EXP)}
function uid(){return crypto.randomUUID?crypto.randomUUID():'r-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function finish(id,ok,v){const p=pending[id];if(!p)return;clearTimeout(p.to);delete pending[id];ok?p.res(v):p.rej(v)}
window.addEventListener('message',e=>{const sink=document.getElementById('apiSink');if(!sink||e.source!==sink.contentWindow)return;const m=e.data;if(!m||m.type!=='KruaFlowApiResult'||!pending[m.requestId])return;const r=m.result||{};finish(m.requestId,!!r.ok,r.ok?(r.data||{}):new Error(r.error||'เข้าสู่ระบบไม่สำเร็จ'))});
function poll(id,n){if(!pending[id])return;if(n>16){finish(id,false,new Error('Backend ไม่ตอบสนอง'));return}const cb='__kfw_'+id.replace(/[^A-Za-z0-9_]/g,'_')+'_'+n,s=document.createElement('script');let done=false;function clean(){if(done)return;done=true;try{delete window[cb]}catch(e){}s.remove()}window[cb]=r=>{clean();if(!r||!r.ready){setTimeout(()=>poll(id,n+1),700);return}r.ok?finish(id,true,r.data||{}):finish(id,false,new Error(r.error||'เข้าสู่ระบบไม่สำเร็จ'))};s.onerror=()=>{clean();setTimeout(()=>poll(id,n+1),900)};s.src=api+'?api=status&requestId='+encodeURIComponent(id)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.head.appendChild(s);setTimeout(()=>{if(!done){clean();setTimeout(()=>poll(id,n+1),900)}},3000)}
function call(p){if(window.KRUA_FLOW_MOCK&&window.KRUA_FLOW_MOCK.enabled)return Promise.resolve(window.KRUA_FLOW_MOCK.handle(p));return new Promise((res,rej)=>{const id=uid();p.requestId=id;const f=document.createElement('form');f.method='POST';f.action=api;f.target='apiSink';f.style.display='none';const i=document.createElement('input');i.name='payload';i.value=JSON.stringify(p);f.appendChild(i);document.body.appendChild(f);pending[id]={res,rej,to:setTimeout(()=>finish(id,false,new Error('Backend ตอบช้าเกินไป')),25000)};f.submit();setTimeout(()=>f.remove(),2500);setTimeout(()=>poll(id,0),450)})}
function sendAdminSession(){const t=token();if(!t)return;try{frame.contentWindow.postMessage({type:'KruaFlowAdminSession',token:t},location.origin)}catch(e){}}
function resetEmbeddedScroll(){
  try{
    const win=frame.contentWindow,doc=frame.contentDocument;
    if(win)win.scrollTo(0,0);
    if(doc){
      if(doc.documentElement)doc.documentElement.scrollTop=0;
      if(doc.body)doc.body.scrollTop=0;
      const scrollers=doc.querySelectorAll('[style*="overflow"],.scroll,.tableWrap,.detailShell,.modalCard');
      scrollers.forEach(el=>{try{el.scrollTop=0}catch(e){}});
    }
    setTimeout(()=>{try{frame.contentWindow.scrollTo(0,0);if(frame.contentDocument?.documentElement)frame.contentDocument.documentElement.scrollTop=0;if(frame.contentDocument?.body)frame.contentDocument.body.scrollTop=0}catch(e){}},180);
  }catch(e){}
}
function environmentUrl(raw){if(new URLSearchParams(location.search).get('staging')!=='1')return raw||'';const u=new URL(raw||'',location.href);u.searchParams.set('staging','1');return u.href}
function openView(btn,persist=true){if(!btn)return;buttons.forEach(x=>x.classList.toggle('active',x===btn));frame.src=environmentUrl(btn.dataset.url||'');title.textContent=btn.dataset.title||btn.textContent.trim();if(persist)localStorage.setItem(KEY_VIEW,btn.dataset.view||'overview');shell.classList.remove('menuOpen')}
function startWorkspace(){auth.classList.add('hidden');const q=new URLSearchParams(location.search).get('view'),saved=q||localStorage.getItem(KEY_VIEW)||'overview',start=buttons.find(x=>x.dataset.view===saved)||buttons[0];openView(start,false)}
async function login(){err.classList.remove('show');const pin=document.getElementById('adminPin').value.replace(/\D/g,'').slice(0,6);if(pin.length!==6){err.textContent='กรุณากรอก PIN Admin 6 หลัก';err.classList.add('show');return}document.getElementById('busy').classList.add('show');try{const r=await call({op:'adminLoginFast',adminPin:pin});const t=r.token||r.adminToken||r.sessionToken||'';if(!t)throw new Error('ไม่ได้รับ Admin Token');saveToken(t);document.getElementById('adminPin').value='';startWorkspace()}catch(e){err.textContent=e.message||String(e);err.classList.add('show')}finally{document.getElementById('busy').classList.remove('show')}}
function loadGroupState(){let saved={};try{saved=JSON.parse(localStorage.getItem(KEY_GROUPS)||'{}')}catch(e){}document.querySelectorAll('.group').forEach((g,i)=>{const title=g.querySelector('.groupTitle');if(!title)return;const key=title.textContent.trim()||('group'+i);g.dataset.groupKey=key;if(saved[key])g.classList.add('collapsed');title.setAttribute('role','button');title.setAttribute('tabindex','0');title.setAttribute('aria-expanded',g.classList.contains('collapsed')?'false':'true');const toggle=()=>{g.classList.toggle('collapsed');title.setAttribute('aria-expanded',g.classList.contains('collapsed')?'false':'true');let state={};try{state=JSON.parse(localStorage.getItem(KEY_GROUPS)||'{}')}catch(e){}state[key]=g.classList.contains('collapsed');localStorage.setItem(KEY_GROUPS,JSON.stringify(state))};title.onclick=toggle;title.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();toggle()}}})}
buttons.forEach(btn=>btn.onclick=()=>openView(btn));document.querySelectorAll('[data-external]').forEach(btn=>btn.onclick=()=>window.open(btn.dataset.external,'_blank','noopener'));loadGroupState();frame.addEventListener('load',()=>{setTimeout(sendAdminSession,30);setTimeout(resetEmbeddedScroll,45)});window.addEventListener('message',e=>{if(e.origin!==location.origin||e.source!==frame.contentWindow)return;const m=e.data||{};if(m.type==='KruaFlowAdminSessionRequest')sendAdminSession()});
document.getElementById('loginBtn').onclick=login;document.getElementById('adminPin').onkeydown=e=>{if(e.key==='Enter')login()};document.getElementById('collapseBtn').onclick=()=>{shell.classList.toggle('collapsed');localStorage.setItem(KEY_COLLAPSE,shell.classList.contains('collapsed')?'1':'0')};document.getElementById('mobileMenu').onclick=()=>shell.classList.toggle('menuOpen');document.getElementById('reloadBtn').onclick=()=>{try{frame.contentWindow.location.reload()}catch(e){frame.src=frame.src}};document.getElementById('openBtn').onclick=()=>window.open(frame.src,'_blank','noopener');document.getElementById('logoutBtn').onclick=()=>{clearToken();frame.src='about:blank';auth.classList.remove('hidden')};
if(localStorage.getItem(KEY_COLLAPSE)==='1')shell.classList.add('collapsed');
try{const cfg=window.KRUA_FLOW_CONFIG||{},staging=new URLSearchParams(location.search).get('staging')==='1',v=staging?(cfg.STAGING_API_URL||''):cfg.API_URL;api=String(v||'').split('?')[0]}catch(e){}
if(token())startWorkspace();
})();
</script>
</body></html>

<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Krua Flow Manager Portal</title><script src="./config.js"></script><script src="./mock-data.js"></script><script src="./ux.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#152740;--muted:#748197;--line:#e3e9f2;--blue:#2b73df;--green:#15965c;--orange:#e88720;--red:#d94b4b;--shadow:0 8px 26px rgba(31,67,108,.07)}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Thai","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.wrap{max-width:1120px;margin:auto;padding:14px 12px 70px}.top{display:flex;align-items:center;gap:10px;margin-bottom:12px}.brand{font-size:27px;font-weight:950;color:#0e5b8b}.sub{font-size:13px;color:var(--muted);font-weight:800}.spacer{flex:1}.btn{min-height:42px;border:0;border-radius:10px;padding:0 14px;font-weight:950;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf2f8;color:#26425f}.danger{background:#fff0f0;color:#a52f2f}.green{background:#e5f7ed;color:#0e7747}.card{background:#fff;border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:var(--shadow);margin-bottom:11px}.filters{display:grid;grid-template-columns:1fr 1fr auto;gap:9px}.input,.select,.textarea{width:100%;border:1px solid #ced8e5;border-radius:10px;min-height:44px;padding:0 11px;background:#fff}.textarea{padding:10px;min-height:74px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:9px}.metric{border:1px solid var(--line);border-radius:12px;padding:12px}.metric .v{font-size:25px;font-weight:950;margin-top:3px}.sectionTitle{font-size:20px;font-weight:950;margin:0 0 10px}.muted{color:var(--muted);font-size:13px;font-weight:750}.list{display:grid;gap:8px}.item{border:1px solid var(--line);border-radius:12px;padding:12px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.pill{display:inline-block;border-radius:999px;padding:4px 8px;font-size:11px;font-weight:950}.ok{background:#e3f7eb;color:#117b4a}.warn{background:#fff0d7;color:#b96a00}.bad{background:#ffe7e7;color:#b83131}.info{background:#e8f1ff;color:#356fc1}.tabs{display:flex;gap:7px;overflow:auto;margin:10px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);background:#fff;border-radius:999px;padding:8px 13px;font-weight:900}.tabs button.active{background:#173f69;color:#fff}.view{display:none}.view.active{display:block}.tableWrap{overflow:auto}.tbl{width:100%;border-collapse:collapse;min-width:740px}.tbl th,.tbl td{padding:9px;border-bottom:1px solid var(--line);text-align:left;font-size:13px}.tbl th{background:#f8fafc}.overlay{position:fixed;inset:0;background:rgba(244,247,251,.85);display:none;place-items:center;z-index:20}.overlay.show{display:grid}.box{background:#fff;padding:20px 26px;border-radius:14px;box-shadow:var(--shadow);font-weight:900}.notice{background:#fff7df;color:#806300;border-radius:11px;padding:11px;font-weight:800}@media(max-width:760px){.filters{grid-template-columns:1fr}.grid{grid-template-columns:1fr 1fr}.top .sub{display:none}}
</style></head><body><iframe name="apiSink" id="apiSink" style="display:none"></iframe><div class="overlay" id="busy"><div class="box" id="busyText">กำลังโหลด...</div></div>
<div class="wrap"><header class="top"><div><div class="brand">Krua Flow</div><div class="sub" id="who">Manager Portal</div></div><div class="spacer"></div><button class="btn secondary" id="employeeBtn">หน้าพนักงาน</button><button class="btn primary" id="scheduleBtn">จัดตารางงาน</button><button data-kf-install class="btn secondary" type="button" style="display:none">ติดตั้งแอป</button></header>
<section class="card"><div class="filters"><select class="select" id="branch"></select><select class="select" id="department"></select><button class="btn secondary" id="refresh">รีเฟรช</button></div><div class="muted" id="scopeNote" style="margin-top:7px"></div></section>
<section class="card"><div class="grid"><div class="metric"><div class="muted">พนักงานในทีม</div><div class="v" id="mTeam">0</div></div><div class="metric"><div class="muted">ลารออนุมัติ</div><div class="v" id="mLeave">0</div></div><div class="metric"><div class="muted">ขอแก้เวลา</div><div class="v" id="mCorrection">0</div></div><div class="metric"><div class="muted">สลับกะรออนุมัติ</div><div class="v" id="mSwap">0</div></div></div></section>
<nav class="tabs"><button class="active" data-view="daily">รายงานกะ</button><button data-view="leave">อนุมัติลา</button><button data-view="correction">แก้เวลา</button><button data-view="swap">สลับกะ</button><button data-view="team">ทีม</button></nav>
<section class="view active" id="v-daily"><div class="card"><div class="sectionTitle">Daily Shift Check</div><div class="notice">ระบบจะสร้างรายงานหลังกะเริ่มประมาณ 25 นาที เพื่อให้ผู้จัดการตรวจภายใน 30 นาที</div><div class="list" id="dailyList" style="margin-top:10px"></div></div></section>
<section class="view" id="v-leave"><div class="card"><div class="sectionTitle">คำขอหยุด / ลารออนุมัติ</div><div class="list" id="leaveList"></div></div></section>
<section class="view" id="v-correction"><div class="card"><div class="sectionTitle">คำขอแก้ไขเวลา</div><div class="list" id="correctionList"></div></div></section>
<section class="view" id="v-swap"><div class="card"><div class="sectionTitle">คำขอสลับกะ</div><div class="list" id="swapList"></div></div></section>
<section class="view" id="v-team"><div class="card"><div class="sectionTitle">พนักงานในทีม</div><div class="tableWrap"><table class="tbl"><thead><tr><th>รหัส</th><th>ชื่อ</th><th>ชื่อเล่น</th><th>ตำแหน่ง</th><th>สาขา</th><th>แผนก</th></tr></thead><tbody id="teamRows"></tbody></table></div></div></section>
</div>
<script>
(()=>{const $=id=>document.getElementById(id),KEY='kruaFlowPortalTokenV7',EXP='kruaFlowPortalTokenV7Exp',state={api:'',token:'',summary:null,scopes:[],branch:'',department:''},pending={};function uid(){return crypto.randomUUID?crypto.randomUUID():'r-'+Date.now()+'-'+Math.random().toString(16).slice(2)}function busy(v,t){$('busy').classList.toggle('show',!!v);if(t)$('busyText').textContent=t}function tag(s){return window.KF_STATUS?window.KF_STATUS.classFor(s):(String(s||'')==='REJECTED'?'bad':String(s||'')==='APPROVED'?'ok':'warn')}function dmy(v){if(!v)return'-';return new Date(v+'T00:00:00').toLocaleDateString('th-TH',{day:'numeric',month:'short',year:'numeric'})}function apiUrl(){const v=(window.KRUA_FLOW_CONFIG&&window.KRUA_FLOW_CONFIG.API_URL)||'';if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(v))throw new Error('Backend URL ไม่ถูกต้อง');return v.split('?')[0]}window.addEventListener('message',e=>{const sink=document.getElementById('apiSink');if(!sink||e.source!==sink.contentWindow)return;const m=e.data;if(!m||m.type!=='KruaFlowApiResult'||!pending[m.requestId])return;finishCall(m.requestId,!!(m.result&&m.result.ok),m.result&&m.result.ok?(m.result.data||{}):new Error(m.result&&m.result.error||'ทำรายการไม่สำเร็จ'))});
function finishCall(id,ok,value){const p=pending[id];if(!p)return;clearTimeout(p.fallback);clearTimeout(p.timeout);delete pending[id];ok?p.res(value):p.rej(value)}
function pollCall(id,n){if(!pending[id])return;if(n>18){finishCall(id,false,new Error('Backend ไม่ตอบสนองหลังรอ 45 วินาที'));return}const cb='__kfp_'+id.replace(/[^A-Za-z0-9_]/g,'_')+'_'+n,s=document.createElement('script');let done=false;function clean(){done=true;try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()}window[cb]=r=>{clean();if(!r||!r.ready){setTimeout(()=>pollCall(id,n+1),900);return}r.ok?finishCall(id,true,r.data||{}):finishCall(id,false,new Error(r.error||'ทำรายการไม่สำเร็จ'))};s.onerror=()=>{clean();setTimeout(()=>pollCall(id,n+1),1000)};s.src=state.api+'?api=status&requestId='+encodeURIComponent(id)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.body.appendChild(s);setTimeout(()=>{if(!done){clean();setTimeout(()=>pollCall(id,n+1),900)}},3500)}
function call(p,opts){opts=opts||{};if(window.KRUA_FLOW_MOCK&&window.KRUA_FLOW_MOCK.enabled)return Promise.resolve(window.KRUA_FLOW_MOCK.handle(p));return new Promise((res,rej)=>{const id=uid();p.requestId=id;const f=document.createElement('form');f.method='POST';f.action=state.api;f.target='apiSink';f.style.display='none';const i=document.createElement('input');i.name='payload';i.value=JSON.stringify(p);f.appendChild(i);document.body.appendChild(f);pending[id]={res,rej,fallback:null,timeout:null};try{f.submit()}catch(e){delete pending[id];f.remove();rej(e);return}setTimeout(()=>f.remove(),3000);pending[id].fallback=setTimeout(()=>{if(pending[id])pollCall(id,0)},700);pending[id].timeout=setTimeout(()=>finishCall(id,false,new Error(opts.timeoutMessage||'Backend ตอบช้าเกินไป กรุณาลองใหม่')),opts.timeoutMs||45000)})}function token(){const t=localStorage.getItem(KEY)||'',e=Number(localStorage.getItem(EXP)||0);return t&&e>Date.now()?t:''}
function availableScopes(){return(state.scopes||[]).filter(s=>s.active!==false)}function syncFilters(){const scopes=availableScopes(),branches=[...new Set(scopes.map(s=>s.branchCode))],deps=[...new Set(scopes.filter(s=>!state.branch||s.branchCode==='*'||s.branchCode===state.branch).map(s=>s.departmentCode))];$('branch').innerHTML=branches.map(x=>'<option value="'+x+'">'+(x==='*'?'ทุกสาขาที่ได้รับสิทธิ์':x)+'</option>').join('');if(!state.branch||!branches.includes(state.branch))state.branch=branches[0]||'';$('branch').value=state.branch;$('department').innerHTML=deps.map(x=>'<option value="'+x+'">'+(x==='*'?'ทุกแผนกที่ได้รับสิทธิ์':x)+'</option>').join('');if(!state.department||!deps.includes(state.department))state.department=deps[0]||'';$('department').value=state.department;$('scopeNote').textContent='แสดงเฉพาะ Scope ที่ Admin กำหนดให้ผู้จัดการคนนี้'}function exactScope(){const s=availableScopes();let b=state.branch,d=state.department;if(b==='*')b=(s.find(x=>x.branchCode!=='*')||{}).branchCode||'';if(d==='*')d=(s.find(x=>(x.branchCode==='*'||x.branchCode===b)&&x.departmentCode!=='*')||{}).departmentCode||'';return{branch:b,department:d}}
async function boot(){state.api=apiUrl();state.token=token();if(!state.token){location.href='./portal.html';return}try{busy(1,'กำลังโหลดมุมมองผู้จัดการ...');let b=null;try{b=await call({op:'managerDashboardBundle',portalToken:state.token},{timeoutMs:60000})}catch(bundleErr){if(!/คำสั่ง API|ไม่ถูกต้อง/.test(bundleErr.message||''))throw bundleErr}if(b&&b.summary){state.summary=b.summary;state.scopes=state.summary.scopes||[];state.branch=b.branchCode||'';state.department=b.departmentCode||'';localStorage.setItem('kfGate7','1');$('who').textContent=(state.summary.employee.nickname||state.summary.employee.name)+' • ผู้จัดการ';$('mLeave').textContent=state.summary.pendingLeave||0;$('mCorrection').textContent=state.summary.pendingCorrections||0;$('mSwap').textContent=state.summary.pendingSwaps||0;syncFilters();renderManagerBundle(b)}else{state.summary=await call({op:'managerSummary',portalToken:state.token});localStorage.setItem('kfGate7','1');state.scopes=state.summary.scopes||[];$('who').textContent=(state.summary.employee.nickname||state.summary.employee.name)+' • ผู้จัดการ';$('mLeave').textContent=state.summary.pendingLeave||0;$('mCorrection').textContent=state.summary.pendingCorrections||0;$('mSwap').textContent=state.summary.pendingSwaps||0;syncFilters();await refresh()}}catch(e){if(/สิทธิ์|Session|เข้าสู่ระบบ/.test(e.message)){alert('บัญชีนี้ไม่มีสิทธิ์ Manager หรือ Session หมดอายุ');location.href='./portal.html'}else alert(e.message)}finally{busy(0)}}
function renderManagerBundle(b){const s={branch:b.branchCode||state.branch,department:b.departmentCode||state.department};renderTeam(b.team||[],s);renderLeave((b.leave||[]).filter(x=>(x.branchCode===s.branch||state.branch==='*')&&(x.departmentCode===s.department||state.department==='*')));renderCorrections((b.corrections||[]).filter(x=>(x.branchCode===s.branch||state.branch==='*')&&(x.departmentCode===s.department||state.department==='*')));renderSwaps((b.swaps||[]).filter(x=>(x.branchCode===s.branch||state.branch==='*')&&(x.departmentCode===s.department||state.department==='*')));renderDaily((b.daily||[]).filter(x=>(x.branchCode===s.branch||state.branch==='*')&&(x.departmentCode===s.department||state.department==='*')))}
async function refresh(){const s=exactScope();if(!s.branch||!s.department)return;busy(1,'กำลังโหลดข้อมูลทีม...');try{try{const b=await call({op:'managerDashboardBundle',portalToken:state.token,branchCode:s.branch,departmentCode:s.department},{timeoutMs:60000});if(b&&b.summary){state.summary=b.summary;renderManagerBundle(b);return}}catch(bundleErr){if(!/คำสั่ง API|ไม่ถูกต้อง/.test(bundleErr.message||''))throw bundleErr}const [team,leave,cor,swap,daily]=await Promise.all([call({op:'managerGetTeam',portalToken:state.token,branchCode:s.branch,departmentCode:s.department}),call({op:'managerGetLeaveRequests',portalToken:state.token,status:'PENDING'}),call({op:'managerGetAttendanceCorrections',portalToken:state.token,status:'PENDING'}),call({op:'managerGetShiftSwapRequests',portalToken:state.token,status:'PENDING_MANAGER'}),call({op:'managerGetDailyChecks',portalToken:state.token})]);renderManagerBundle({branchCode:s.branch,departmentCode:s.department,team:team.rows||[],leave:leave.rows||[],corrections:cor.rows||[],swaps:swap.rows||[],daily:daily.rows||[]})}finally{busy(0)}}
function renderTeam(rows,s){$('mTeam').textContent=rows.length;$('teamRows').innerHTML=rows.map(x=>'<tr><td>'+x.id+'</td><td>'+x.name+'</td><td>'+x.nickname+'</td><td>'+x.position+'</td><td>'+x.branch+'</td><td>'+x.department+'</td></tr>').join('')||'<tr><td colspan="6">ไม่มีพนักงาน</td></tr>'}
function renderLeave(rows){$('leaveList').innerHTML=rows.map(x=>'<div class="item"><div class="row"><b>'+x.employeeName+' ('+x.nickname+')</b><span class="pill '+tag(x.status)+'">'+x.status+'</span></div><div>'+x.leaveTypeLabel+' • '+dmy(x.startDate)+(x.endDate!==x.startDate?' – '+dmy(x.endDate):'')+' • '+(x.shiftCode||'-')+'</div><div class="muted">'+(x.reason||'')+(x.scheduleConflict?' • ชนตาราง: '+x.scheduleConflict:'')+' • โควต้า '+(x.quotaStatus||'-')+'</div><div class="row" style="margin-top:8px"><button class="btn green approveLeave" data-id="'+x.leaveId+'">อนุมัติ</button><button class="btn danger rejectLeave" data-id="'+x.leaveId+'">ไม่อนุมัติ</button></div></div>').join('')||'<div class="muted">ไม่มีรายการรออนุมัติ</div>';document.querySelectorAll('.approveLeave').forEach(b=>b.onclick=()=>reviewLeave(b.dataset.id,'APPROVED'));document.querySelectorAll('.rejectLeave').forEach(b=>b.onclick=()=>reviewLeave(b.dataset.id,'REJECTED'))}
async function reviewLeave(id,decision){let note=prompt(decision==='APPROVED'?'หมายเหตุการอนุมัติ (ถ้ามี)':'เหตุผลที่ไม่อนุมัติ')||'';let confirmScheduleChange=false;if(decision==='APPROVED')confirmScheduleChange=confirm('หากคำขอนี้ชนกับตารางงาน ให้ยืนยันการเปลี่ยนตาราง/ยกเลิกกะเดิมด้วยหรือไม่?');try{busy(1,'กำลังบันทึก...');await call({op:'managerReviewLeave',portalToken:state.token,leaveId:id,decision,note,confirmScheduleChange});await refresh()}catch(e){alert(e.message)}finally{busy(0)}}
function renderCorrections(rows){$('correctionList').innerHTML=rows.map(x=>'<div class="item"><div class="row"><b>'+x.employeeId+' • '+dmy(x.date)+'</b><span class="pill kf-info">'+x.correctionType+'</span></div><div>เข้า '+(x.requestedIn||'-')+' • ออก '+(x.requestedOut||'-')+'</div><div class="muted">'+(x.reason||'')+'</div><div class="row" style="margin-top:8px"><button class="btn green approveCor" data-id="'+x.correctionId+'">อนุมัติ</button><button class="btn danger rejectCor" data-id="'+x.correctionId+'">ไม่อนุมัติ</button></div></div>').join('')||'<div class="muted">ไม่มีคำขอแก้เวลา</div>';document.querySelectorAll('.approveCor').forEach(b=>b.onclick=()=>reviewCor(b.dataset.id,'APPROVED'));document.querySelectorAll('.rejectCor').forEach(b=>b.onclick=()=>reviewCor(b.dataset.id,'REJECTED'))}
async function reviewCor(id,decision){const note=prompt('หมายเหตุผู้จัดการ')||'';try{busy(1,'กำลังบันทึก...');await call({op:'managerReviewAttendanceCorrection',portalToken:state.token,correctionId:id,decision,note});await refresh()}catch(e){alert(e.message)}finally{busy(0)}}
function renderSwaps(rows){$('swapList').innerHTML=rows.map(x=>'<div class="item"><div class="row"><b>'+x.requesterId+' ↔ '+x.targetEmployeeId+'</b><span class="pill '+tag(x.status)+'">'+x.status+'</span></div><div>'+dmy(x.date)+' • '+x.requesterShift+' ↔ '+x.targetShift+'</div><div class="muted">'+(x.reason||'')+'</div><div class="row" style="margin-top:8px"><button class="btn green approveSwap" data-id="'+x.swapId+'">อนุมัติ</button><button class="btn danger rejectSwap" data-id="'+x.swapId+'">ไม่อนุมัติ</button></div></div>').join('')||'<div class="muted">ไม่มีคำขอสลับกะ</div>';document.querySelectorAll('.approveSwap').forEach(b=>b.onclick=()=>reviewSwap(b.dataset.id,'APPROVED'));document.querySelectorAll('.rejectSwap').forEach(b=>b.onclick=()=>reviewSwap(b.dataset.id,'REJECTED'))}
async function reviewSwap(id,decision){const note=prompt('หมายเหตุผู้จัดการ')||'';try{busy(1,'กำลังบันทึก...');await call({op:'managerReviewShiftSwap',portalToken:state.token,swapId:id,decision,note});await refresh()}catch(e){alert(e.message)}finally{busy(0)}}
function renderDaily(rows){$('dailyList').innerHTML=rows.slice(0,30).map(x=>'<div class="item"><div class="row"><b>'+dmy(x.date)+' • '+x.shiftCode+' • '+x.branchCode+'/'+x.departmentCode+'</b><span class="pill '+tag(x.status)+'">'+x.status+'</span></div><div>ตามตาราง '+x.expectedCount+' • ควรมา '+x.requiredCount+' • มาแล้ว '+x.presentCount+' • ยังไม่เข้า '+x.missingCount+' • สาย '+x.lateCount+' • นอกแผน '+x.unplannedCount+'</div><div class="muted">Minimum '+x.minimumStaffing+' • '+x.createdAt+'</div>'+(x.status==='ACTION_REQUIRED'?'<button class="btn primary resolve" style="margin-top:8px" data-id="'+x.checkId+'">บันทึกการดำเนินการ</button>':'')+'</div>').join('')||'<div class="muted">ยังไม่มี Daily Shift Check</div>';document.querySelectorAll('.resolve').forEach(b=>b.onclick=()=>resolveCheck(b.dataset.id))}
async function resolveCheck(id){const note=prompt('ระบุการดำเนินการ เช่น ติดต่อแล้ว / เรียกคนสำรอง / ย้ายคนจากสาขาอื่น');if(!note)return;try{busy(1,'กำลังบันทึก...');await call({op:'managerResolveDailyCheck',portalToken:state.token,checkId:id,note});await refresh()}catch(e){alert(e.message)}finally{busy(0)}}
$('branch').onchange=()=>{state.branch=$('branch').value;syncFilters();refresh()};$('department').onchange=()=>{state.department=$('department').value;refresh()};$('refresh').onclick=refresh;$('employeeBtn').onclick=()=>location.href='./portal.html';$('scheduleBtn').onclick=()=>{const s=exactScope();location.href='./schedule.html?branch='+encodeURIComponent(s.branch)+'&department='+encodeURIComponent(s.department)};document.querySelectorAll('.tabs button').forEach(b=>b.onclick=()=>{document.querySelectorAll('.tabs button').forEach(x=>x.classList.remove('active'));b.classList.add('active');document.querySelectorAll('.view').forEach(x=>x.classList.remove('active'));$('v-'+b.dataset.view).classList.add('active')});boot()})();
</script></body></html>

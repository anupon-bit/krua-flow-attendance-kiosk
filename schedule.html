<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Krua Flow Work Schedule</title><script src="./config.js"></script><script src="./mock-data.js"></script><script src="./ux.js"></script>
<style>
:root{--bg:#f4f7fb;--card:#fff;--text:#14233b;--muted:#758198;--line:#dfe7f1;--blue:#2d73df;--green:#188e58;--red:#c94646;--yellow:#f4b942;--night:#6954d7;--off:#dfe7ef}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Noto Sans Thai","Segoe UI",sans-serif}button,input,select,textarea{font:inherit}.wrap{max-width:1500px;margin:auto;padding:12px}.top{display:flex;gap:9px;align-items:center;flex-wrap:wrap}.brand{font-size:27px;font-weight:950;color:#0e5b8b}.sub{color:var(--muted);font-size:13px;font-weight:800}.spacer{flex:1}.btn{min-height:42px;border:0;border-radius:10px;padding:0 13px;font-weight:950;cursor:pointer}.primary{background:var(--blue);color:#fff}.secondary{background:#edf2f8;color:#24405e}.green{background:#e5f7ed;color:#0c7646}.danger{background:#fff0f0;color:#a53131}.card{background:#fff;border:1px solid var(--line);border-radius:15px;padding:14px;margin-top:10px;box-shadow:0 7px 22px rgba(32,70,111,.06)}.controls{display:grid;grid-template-columns:180px 180px 180px auto auto auto;gap:8px}.select,.input{width:100%;min-height:42px;border:1px solid #ced8e5;border-radius:9px;padding:0 10px;background:#fff}.muted{color:var(--muted);font-size:12px;font-weight:750}.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:12px}.tbl{border-collapse:separate;border-spacing:0;min-width:1200px;width:100%}.tbl th,.tbl td{border-right:1px solid var(--line);border-bottom:1px solid var(--line);padding:0;text-align:center;vertical-align:middle}.tbl th{background:#f8fafc;font-size:12px;font-weight:950;padding:8px;position:sticky;top:0;z-index:4}.tbl th.emp,.tbl td.emp{position:sticky;left:0;z-index:3;background:#fff;text-align:left;min-width:190px;padding:8px}.tbl th.emp{z-index:5;background:#f8fafc}.cell{min-width:115px;height:72px;position:relative}.cell select{width:100%;height:100%;border:0;background:transparent;padding:6px;font-weight:900;text-align:center}.cell.lock{background:#fff1d8}.cell.lock select{display:none}.lockText{font-size:12px;font-weight:900;color:#9b6200;padding:7px}.sum{display:grid;grid-template-columns:190px repeat(7,minmax(115px,1fr));min-width:995px}.sum>div{padding:8px;border-right:1px solid var(--line);border-bottom:1px solid var(--line);text-align:center;font-size:12px;font-weight:900}.sum .label{text-align:left;background:#f8fafc;position:sticky;left:0;z-index:2}.day{background:#e7f6ec!important;color:#166c46}.night{background:#eeeaff!important;color:#5943bf}.off{background:#eef2f6!important;color:#66788c}.status{display:inline-block;padding:4px 8px;border-radius:999px;font-size:11px;font-weight:950}.draft{background:#fff0da;color:#a96800}.published{background:#e4f7eb;color:#147a4b}.notice{padding:10px 12px;border-radius:10px;background:#fff7de;color:#806100;font-weight:800}.overlay{position:fixed;inset:0;background:rgba(244,247,251,.86);display:none;place-items:center;z-index:20}.overlay.show{display:grid}.box{background:#fff;padding:20px 26px;border-radius:14px;box-shadow:0 8px 30px #0001;font-weight:900}@media(max-width:900px){.controls{grid-template-columns:1fr 1fr}.top .sub{display:none}}
</style></head><body><iframe name="apiSink" id="apiSink" style="display:none"></iframe><div class="overlay" id="busy"><div class="box" id="busyText">กำลังโหลด...</div></div>
<div class="wrap"><header class="top"><div><div class="brand">Krua Flow</div><div class="sub">Work Schedule • จัดตารางงานล่วงหน้า 1 สัปดาห์</div></div><div class="spacer"></div><button class="btn secondary" id="managerBtn">กลับ Manager</button><button data-kf-install class="btn secondary" type="button" style="display:none">ติดตั้งแอป</button></header>
<section class="card"><div class="controls"><select class="select" id="branch"></select><select class="select" id="department"></select><input class="input" id="week" type="date"><button class="btn secondary" id="load">โหลดตาราง</button><button class="btn secondary" id="copyPrev">คัดลอกสัปดาห์ก่อน</button><button class="btn primary" id="save">บันทึก Draft</button></div><div class="top" style="margin-top:10px"><div id="versionText" class="muted">-</div><div class="spacer"></div><button class="btn green" id="publish">ประกาศตาราง</button></div></section>
<section class="card"><div class="notice">ช่องสีเหลืองคือพนักงานที่มีคำขอหยุด/ลา PENDING หรือ APPROVED ระบบจะไม่ยอมบันทึกเป็นวันทำงาน</div></section>
<section class="card"><div class="tableWrap"><table class="tbl"><thead><tr id="head"><th class="emp">พนักงาน</th></tr></thead><tbody id="body"></tbody></table><div id="summary"></div></div></section>
</div>
<script>
(()=>{const $=id=>document.getElementById(id),KEY='kruaFlowPortalTokenV7',EXP='kruaFlowPortalTokenV7Exp',state={api:'',token:'',summary:null,scopes:[],branch:'',department:'',team:[],items:[],version:null,published:null,locks:{},shifts:[]},pending={};function uid(){return crypto.randomUUID?crypto.randomUUID():'r-'+Date.now()+'-'+Math.random().toString(16).slice(2)}function busy(v,t){$('busy').classList.toggle('show',!!v);if(t)$('busyText').textContent=t}function iso(d){const z=n=>String(n).padStart(2,'0');return d.getFullYear()+'-'+z(d.getMonth()+1)+'-'+z(d.getDate())}function plus(d,n){const x=new Date(d);x.setDate(x.getDate()+n);return x}function monday(d){const x=new Date(d),day=(x.getDay()+6)%7;x.setDate(x.getDate()-day);x.setHours(0,0,0,0);return x}function apiUrl(){const v=(window.KRUA_FLOW_CONFIG&&window.KRUA_FLOW_CONFIG.API_URL)||'';if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec/.test(v))throw new Error('Backend URL ไม่ถูกต้อง');return v.split('?')[0]}window.addEventListener('message',e=>{const sink=document.getElementById('apiSink');if(!sink||e.source!==sink.contentWindow)return;const m=e.data;if(!m||m.type!=='KruaFlowApiResult'||!pending[m.requestId])return;finishCall(m.requestId,!!(m.result&&m.result.ok),m.result&&m.result.ok?(m.result.data||{}):new Error(m.result&&m.result.error||'ทำรายการไม่สำเร็จ'))});
function finishCall(id,ok,value){const p=pending[id];if(!p)return;clearTimeout(p.fallback);clearTimeout(p.timeout);delete pending[id];ok?p.res(value):p.rej(value)}
function pollCall(id,n){if(!pending[id])return;if(n>18){finishCall(id,false,new Error('Backend ไม่ตอบสนองหลังรอ 45 วินาที'));return}const cb='__kfp_'+id.replace(/[^A-Za-z0-9_]/g,'_')+'_'+n,s=document.createElement('script');let done=false;function clean(){done=true;try{delete window[cb]}catch(e){window[cb]=undefined}s.remove()}window[cb]=r=>{clean();if(!r||!r.ready){setTimeout(()=>pollCall(id,n+1),900);return}r.ok?finishCall(id,true,r.data||{}):finishCall(id,false,new Error(r.error||'ทำรายการไม่สำเร็จ'))};s.onerror=()=>{clean();setTimeout(()=>pollCall(id,n+1),1000)};s.src=state.api+'?api=status&requestId='+encodeURIComponent(id)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();document.body.appendChild(s);setTimeout(()=>{if(!done){clean();setTimeout(()=>pollCall(id,n+1),900)}},3500)}
function call(p,opts){opts=opts||{};if(window.KRUA_FLOW_MOCK&&window.KRUA_FLOW_MOCK.enabled)return Promise.resolve(window.KRUA_FLOW_MOCK.handle(p));return new Promise((res,rej)=>{const id=uid();p.requestId=id;const f=document.createElement('form');f.method='POST';f.action=state.api;f.target='apiSink';f.style.display='none';const i=document.createElement('input');i.name='payload';i.value=JSON.stringify(p);f.appendChild(i);document.body.appendChild(f);pending[id]={res,rej,fallback:null,timeout:null};try{f.submit()}catch(e){delete pending[id];f.remove();rej(e);return}setTimeout(()=>f.remove(),3000);pending[id].fallback=setTimeout(()=>{if(pending[id])pollCall(id,0)},700);pending[id].timeout=setTimeout(()=>finishCall(id,false,new Error(opts.timeoutMessage||'Backend ตอบช้าเกินไป กรุณาลองใหม่')),opts.timeoutMs||45000)})}function token(){const t=localStorage.getItem(KEY)||'',e=Number(localStorage.getItem(EXP)||0);return t&&e>Date.now()?t:''}
function query(){const q=new URLSearchParams(location.search);return{branch:q.get('branch')||'',department:q.get('department')||''}}function syncScopeSelectors(){const q=query(),scopes=(state.scopes||[]).filter(s=>s.active!==false&&s.canManageSchedule!==false),branches=[...new Set(scopes.map(s=>s.branchCode).filter(x=>x!=='*'))];$('branch').innerHTML=branches.map(x=>'<option value="'+x+'">'+x+'</option>').join('');state.branch=q.branch&&branches.includes(q.branch)?q.branch:(state.branch||branches[0]||'');$('branch').value=state.branch;const deps=[...new Set(scopes.filter(s=>s.branchCode==='*'||s.branchCode===state.branch).map(s=>s.departmentCode).filter(x=>x!=='*'))];$('department').innerHTML=deps.map(x=>'<option value="'+x+'">'+x+'</option>').join('');state.department=q.department&&deps.includes(q.department)?q.department:(state.department&&deps.includes(state.department)?state.department:deps[0]||'');$('department').value=state.department}
async function boot(){state.api=apiUrl();state.token=token();if(!state.token){location.href='./portal.html';return}try{busy(1,'กำลังโหลดสิทธิ์ผู้จัดการ...');const [s,b]=await Promise.all([call({op:'managerSummary',portalToken:state.token}),call({op:'portalBootstrap',portalToken:state.token})]);state.summary=s;state.scopes=s.scopes||[];state.shifts=(b.shifts||[]).filter(x=>x.active!==false);syncScopeSelectors();const next=plus(monday(new Date()),7);$('week').value=iso(next);await loadAll()}catch(e){alert(/คำสั่ง API/.test(e.message)?'หน้าจัดตารางพร้อมแล้ว แต่ต้อง Deploy Backend V7.1 ก่อนใช้งานจริง':e.message);if(/สิทธิ์|Session/.test(e.message))location.href='./portal.html'}finally{busy(0)}}
async function loadAll(){if(!state.branch||!state.department)return;busy(1,'กำลังโหลดตารางและคำขอหยุด...');try{const week=iso(monday(new Date($('week').value+'T00:00:00')));$('week').value=week;const [team,sch,pend,app]=await Promise.all([call({op:'managerGetTeam',portalToken:state.token,branchCode:state.branch,departmentCode:state.department}),call({op:'managerGetSchedule',portalToken:state.token,branchCode:state.branch,departmentCode:state.department,weekStart:week}),call({op:'managerGetLeaveRequests',portalToken:state.token,status:'PENDING'}),call({op:'managerGetLeaveRequests',portalToken:state.token,status:'APPROVED'})]);state.team=team.rows||[];state.items=sch.items||[];state.version=sch.version||null;state.published=sch.publishedVersion||null;buildLocks((pend.rows||[]).concat(app.rows||[]));render()}finally{busy(0)}}
function buildLocks(rows){state.locks={};rows.filter(x=>x.branchCode===state.branch&&x.departmentCode===state.department).forEach(x=>{let d=new Date(x.startDate+'T00:00:00'),e=new Date(x.endDate+'T00:00:00');while(d<=e){const k=x.employeeId+'|'+iso(d);state.locks[k]={status:x.status,type:x.leaveType,label:x.leaveTypeLabel};d=plus(d,1)}})}function dates(){const s=new Date($('week').value+'T00:00:00');return Array.from({length:7},(_,i)=>plus(s,i))}function itemFor(emp,date){return state.items.find(x=>x.employeeId===emp&&x.date===date)}function cellValue(x){if(!x)return'';if(x.workStatus==='WORK')return x.shiftCode;return x.workStatus||'OFF'}function optionHtml(v){let h='<option value="">ยังไม่จัด</option>';state.shifts.forEach(s=>h+='<option value="'+s.code+'">'+s.name+' '+s.startTime+'-'+s.endTime+'</option>');h+='<option value="OFF">หยุด</option>';return h}
function render(){const ds=dates();$('head').innerHTML='<th class="emp">พนักงาน</th>'+ds.map(d=>'<th>'+d.toLocaleDateString('th-TH',{weekday:'short'})+'<br>'+d.getDate()+'/'+(d.getMonth()+1)+'</th>').join('');$('body').innerHTML='';state.team.forEach(e=>{const tr=document.createElement('tr');let html='<td class="emp"><b>'+(e.nickname||e.name)+'</b><div class="muted">'+e.id+' • '+e.position+'</div></td>';ds.forEach(d=>{const k=e.id+'|'+iso(d),lock=state.locks[k],x=itemFor(e.id,iso(d));if(lock){html+='<td class="cell lock"><div class="lockText">'+(lock.status==='APPROVED'?'🔒 ลา/หยุดอนุมัติ':'🟡 ขอหยุดรออนุมัติ')+'<div class="muted">'+lock.label+'</div></div></td>'}else{html+='<td class="cell"><select data-e="'+e.id+'" data-d="'+iso(d)+'">'+optionHtml()+'</select></td>'}});tr.innerHTML=html;$('body').appendChild(tr)});document.querySelectorAll('.cell select').forEach(s=>{const x=itemFor(s.dataset.e,s.dataset.d);s.value=cellValue(x);paint(s);s.onchange=()=>{paint(s);renderSummary()}});renderSummary();const st=state.version?state.version.status:(state.published?'PUBLISHED':'NONE');$('versionText').innerHTML='Week '+$('week').value+' • Version '+(state.version?state.version.versionNo:(state.published?state.published.versionNo:'-'))+' • <span class="status '+(st==='PUBLISHED'?'published':'draft')+'">'+st+'</span>';}
function paint(s){s.classList.remove('day','night','off');if(s.value==='DAY')s.classList.add('day');else if(s.value==='NIGHT')s.classList.add('night');else if(s.value==='OFF')s.classList.add('off')}
function renderSummary(){const ds=dates(),codes=state.shifts.map(s=>s.code);let html='';codes.forEach(code=>{html+='<div class="sum"><div class="label">'+code+' รวม</div>'+ds.map(d=>'<div>'+document.querySelectorAll('select[data-d="'+iso(d)+'"] option:checked[value="'+code+'"]').length+'</div>').join('')+'</div>'});html+='<div class="sum"><div class="label">รวมทำงาน</div>'+ds.map(d=>'<div>'+Array.from(document.querySelectorAll('select[data-d="'+iso(d)+'"]')).filter(s=>s.value&&s.value!=='OFF').length+'</div>').join('')+'</div>';$('summary').innerHTML=html}
function collect(){const items=[];document.querySelectorAll('.cell select').forEach(s=>{if(!s.value)return;items.push({employeeId:s.dataset.e,date:s.dataset.d,workStatus:s.value==='OFF'?'OFF':'WORK',shiftCode:s.value==='OFF'?'':s.value,source:'MANAGER'})});return items}
async function save(){const items=collect();if(!items.length){alert('ยังไม่มีข้อมูลตาราง');return}try{busy(1,'กำลังบันทึก Draft...');const r=await call({op:'managerSaveSchedule',portalToken:state.token,branchCode:state.branch,departmentCode:state.department,weekStart:$('week').value,items});state.version=r.version||state.version;await loadAll();alert('บันทึก Draft แล้ว')}catch(e){alert(e.message)}finally{busy(0)}}
async function publish(){if(!state.version||state.version.status!=='DRAFT'){alert('ต้องมี Draft ก่อน Publish');return}try{busy(1,'กำลังตรวจและประกาศตาราง...');await call({op:'managerPublishSchedule',portalToken:state.token,versionId:state.version.versionId});await loadAll();alert('ประกาศตารางแล้ว พนักงานจะเห็นใน Employee Portal')}catch(e){if(/Publish ไม่ได้|กำลังคน|ลาที่ล็อก/.test(e.message)){const reason=prompt(e.message+'\n\nหากจำเป็นต้อง Override ให้ระบุเหตุผล');if(reason){try{await call({op:'managerPublishSchedule',portalToken:state.token,versionId:state.version.versionId,allowOverride:true,overrideReason:reason});await loadAll();alert('ประกาศตารางด้วย Override แล้ว')}catch(x){alert(x.message)}}}else alert(e.message)}finally{busy(0)}}
async function copyPrevious(){const cur=new Date($('week').value+'T00:00:00'),prev=plus(cur,-7);try{busy(1,'กำลังคัดลอกสัปดาห์ก่อน...');const r=await call({op:'managerGetSchedule',portalToken:state.token,branchCode:state.branch,departmentCode:state.department,weekStart:iso(prev)});if(!(r.items||[]).length){alert('สัปดาห์ก่อนไม่มีตาราง');return}state.items=(r.items||[]).map(x=>Object.assign({},x,{scheduleId:'',versionId:'',weekStart:$('week').value,date:iso(plus(new Date(x.date+'T00:00:00'),7)),source:'COPIED_CLIENT'}));state.version=null;render();alert('คัดลอกมาเป็นแบบร่างบนหน้าจอแล้ว กด “บันทึก Draft” เพื่อบันทึกจริง')}catch(e){alert(e.message)}finally{busy(0)}}
$('managerBtn').onclick=()=>location.href='./manager.html';$('branch').onchange=()=>{state.branch=$('branch').value;syncScopeSelectors();loadAll()};$('department').onchange=()=>{state.department=$('department').value;loadAll()};$('load').onclick=loadAll;$('week').onchange=()=>{$('week').value=iso(monday(new Date($('week').value+'T00:00:00')));loadAll()};$('save').onclick=save;$('publish').onclick=publish;$('copyPrev').onclick=copyPrevious;boot()})();
</script></body></html>

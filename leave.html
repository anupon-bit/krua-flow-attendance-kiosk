<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>Krua Flow - ขอการลา</title>
<style>
:root{--bg:#f4f6fa;--card:#fff;--text:#17191f;--muted:#6d7480;--line:#d9dee8;--blue:#2865ee;--green:#087a3d}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:720px;margin:auto;padding:18px}.brand{font-size:30px;font-weight:950}.sub{color:var(--muted);font-weight:800;margin-bottom:18px}.card{background:#fff;border:1px solid var(--line);border-radius:22px;padding:18px}.field{margin-top:14px}.field label{display:block;font-weight:900;margin-bottom:7px}.input,.textarea,select{width:100%;border:1px solid #cfd5df;border-radius:14px;padding:0 14px;font:inherit;background:#fff}.input,select{height:54px}.textarea{min-height:100px;padding-top:12px}.pin{text-align:center;letter-spacing:.28em;font-size:24px;font-weight:900}.btn{width:100%;height:56px;border:0;border-radius:14px;font-weight:950;font-size:18px;cursor:pointer}.primary{background:var(--blue);color:#fff}.msg{display:none;margin-top:14px;padding:12px;border-radius:12px;font-weight:850}.msg.show{display:block}.ok{display:block;background:#eaf8ef;color:#086b38}.err{display:block;background:#fff0ee;color:#93241d}.busy{display:none;position:fixed;inset:0;background:#0005;align-items:center;justify-content:center}.busy.show{display:flex}.busy div{background:#fff;padding:18px 22px;border-radius:16px;font-weight:900}
</style><script src="./config.js"></script></head><body>
<iframe name="sink" id="sink" style="display:none"></iframe><div class="busy" id="busy"><div>กำลังส่งคำขอลา...</div></div>
<div class="wrap"><div class="brand">Krua Flow</div><div class="sub">แบบฟอร์มขอการลา</div>
<section class="card">
<div class="field"><label>พนักงาน</label><select id="employee"><option value="">กำลังโหลดรายชื่อ...</option></select></div>
<div class="field"><label>PIN ลงเวลา 4 หลัก</label><input class="input pin" id="pin" type="password" inputmode="numeric" maxlength="4" placeholder="••••"></div>
<div class="field"><label>ประเภทการลา</label><select id="leaveType"><option value="">เลือกประเภท</option><option value="SICK">ลาป่วย</option><option value="PERSONAL">ลากิจ</option><option value="VACATION">ลาพักร้อน</option><option value="OTHER">ลาอื่นๆ</option></select></div>
<div class="field"><label>วันเริ่มลา</label><input class="input" id="startDate" type="date"></div>
<div class="field"><label>วันสิ้นสุด</label><input class="input" id="endDate" type="date"></div>
<div class="field"><label>ช่วงเวลา</label><select id="duration"><option value="FULL_DAY">เต็มวัน</option><option value="HALF_AM">ครึ่งวันเช้า</option><option value="HALF_PM">ครึ่งวันบ่าย</option></select></div>
<div class="field"><label>เหตุผล / รายละเอียด</label><textarea class="textarea" id="reason" placeholder="ระบุเหตุผลการลา"></textarea></div>
<button class="btn primary" id="submitBtn" style="margin-top:16px">ส่งคำขอลา</button>
<div id="msg" class="msg"></div>
</section></div>
<script>
(function(){
const $=id=>document.getElementById(id),state={api:''};
function uid(){return crypto.randomUUID?crypto.randomUUID():'r-'+Date.now()+'-'+Math.random().toString(16).slice(2)}
function apiUrl(v){v=String(v||'').trim();if(!/^https:\/\/script\.google\.com\/macros\/s\/.+\/exec(?:\?.*)?$/.test(v))throw new Error('Backend URL ไม่ถูกต้อง');return v.split('?')[0]}
function setMsg(t,ok){const m=$('msg');m.textContent=t||'';m.className='msg '+(t?(ok?'ok':'err'):'')}
function pollStatus(requestId,resolve,reject,attempt){
  if(attempt>12){reject(new Error('Backend ยังไม่รองรับระบบขอลา หรือยังไม่ได้อัปเดตเวอร์ชัน'));return}
  const cb='__kfl_'+requestId.replace(/[^A-Za-z0-9_]/g,'_')+'_'+attempt,s=document.createElement('script');let done=false;
  function clean(){if(done)return;done=true;try{delete window[cb]}catch(e){};s.remove()}
  window[cb]=r=>{clean();if(!r||!r.ready){setTimeout(()=>pollStatus(requestId,resolve,reject,attempt+1),650);return}if(r.ok)resolve(r.data||{});else reject(new Error(r.error||'ทำรายการไม่สำเร็จ'))};
  s.onerror=()=>{clean();setTimeout(()=>pollStatus(requestId,resolve,reject,attempt+1),800)};
  s.src=state.api+'?api=status&requestId='+encodeURIComponent(requestId)+'&callback='+encodeURIComponent(cb)+'&_='+Date.now();
  document.head.appendChild(s);setTimeout(()=>{if(!done){clean();setTimeout(()=>pollStatus(requestId,resolve,reject,attempt+1),800)}},2500)
}
function call(p){
  return new Promise((resolve,reject)=>{
    const id=uid();p.requestId=id;
    const f=document.createElement('form');f.method='POST';f.action=state.api;f.target='sink';f.style.display='none';
    const i=document.createElement('input');i.type='hidden';i.name='payload';i.value=JSON.stringify(p);f.appendChild(i);document.body.appendChild(f);
    try{f.submit()}catch(e){f.remove();reject(e);return}
    setTimeout(()=>f.remove(),3000);
    setTimeout(()=>pollStatus(id,resolve,reject,0),350)
  })
}
async function boot(){
  try{
    state.api=apiUrl((window.KRUA_FLOW_CONFIG&&window.KRUA_FLOW_CONFIG.API_URL)||'');
    const r=await call({op:'leaveBootstrap'});
    const s=$('employee');s.innerHTML='<option value="">เลือกชื่อพนักงาน</option>';
    (r.employees||[]).forEach(e=>{const o=document.createElement('option');o.value=e.id;o.textContent=(e.nickname||e.name)+' ('+e.id+')';s.appendChild(o)});
    if(!(r.employees||[]).length)throw new Error('ไม่พบรายชื่อพนักงาน');
    setMsg('',true)
  }catch(e){
    $('employee').innerHTML='<option value="">ระบบขอลายังไม่พร้อม</option>';
    setMsg((e.message||String(e))+' — หากยังไม่ได้อัปเดต Backend V6.1 ให้ทำขั้นตอนนั้นก่อน',false)
  }
}
$('pin').oninput=e=>e.target.value=String(e.target.value||'').replace(/\D/g,'').slice(0,4);
$('submitBtn').onclick=async()=>{
  try{
    $('busy').classList.add('show');setMsg('',true);
    const leave={employeeId:$('employee').value,employeePin:$('pin').value,leaveType:$('leaveType').value,startDate:$('startDate').value,endDate:$('endDate').value,duration:$('duration').value,reason:$('reason').value.trim()};
    if(!leave.employeeId||leave.employeePin.length!==4||!leave.leaveType||!leave.startDate||!leave.endDate)throw new Error('กรุณากรอกข้อมูลให้ครบ');
    const r=await call({op:'leaveSubmit',leave});
    setMsg('ส่งคำขอลาเรียบร้อย เลขที่ '+r.leaveId+' รอ Admin อนุมัติ',true);$('reason').value=''
  }catch(e){setMsg(e.message||String(e),false)}finally{$('busy').classList.remove('show')}
};
boot()
})();
</script></body></html>

<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>KruaFlow Workforce</title>
  <script src="./config.js"></script>
  <script src="./mock-data.js"></script>
  <script src="./js/api-client.js"></script>
  <script src="./js/i18n.js"></script>
  <link rel="stylesheet" href="./css/workforce.css">
</head>
<body>
  <main class="page">
    <header class="head">
      <div>
        <h1 id="title">ภาพรวมระบบ</h1>
        <p class="subtitle" id="subtitle">สถานะกำลังคน งานค้าง และสัญญาณที่ต้องติดตาม</p>
      </div>
      <div class="headActions">
        <span class="modeBadge" data-i18n="common.readOnly">อ่านอย่างเดียว</span>
        <span class="env" id="env">STAGING</span>
        <div class="languageSwitch" aria-label="Language">
          <button type="button" data-language="th">ไทย</button>
          <button type="button" data-language="en">EN</button>
        </div>
      </div>
    </header>
    <div id="app" aria-live="polite"></div>
  </main>

  <div class="drawerBackdrop" id="drawerBackdrop" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawerHead">
        <div>
          <div class="metricMeta" data-i18n="detail.title">รายละเอียด</div>
          <h2 id="drawerTitle">รายละเอียดรายการ</h2>
        </div>
        <button class="btn small" type="button" id="drawerClose" data-i18n="common.close">ปิด</button>
      </div>
      <dl class="drawerGrid" id="drawerBody"></dl>
    </aside>
  </div>

<script>
(function () {
  'use strict';

  const I18N = window.KruaFlowI18n;
  const t = I18N.t;
  const params = new URLSearchParams(location.search);
  const view = params.get('view') || 'dashboard';
  const isStaging = params.get('staging') === '1';
  const SESSION_KEY = 'kruaFlowAdminTokenV4';
  const PERSIST_KEY = 'kruaFlowAdminTokenPersistentV1';
  const EXPIRY_KEY = 'kruaFlowAdminTokenPersistentExpV1';
  const app = document.getElementById('app');
  const api = new KruaFlowApi.Client({ timeout: 30000 });
  let token = '';
  let bootstrap = null;
  let renderSequence = 0;

  const VIEW_META = {
    dashboard: ['view.overview', 'subtitle.dashboard'],
    'work-queue': ['view.review', 'subtitle.queue'],
    notifications: ['view.notifications', 'subtitle.notifications'],
    applicants: ['view.applicants', 'subtitle.preview'],
    interviews: ['view.interviews', 'subtitle.preview'],
    staffing: ['view.staffing', 'subtitle.preview'],
    onboarding: ['view.onboarding', 'subtitle.preview'],
    'employee-documents': ['view.employeeDocuments', 'subtitle.preview'],
    offboarding: ['view.offboarding', 'subtitle.preview'],
    attendance: ['view.attendance', 'subtitle.attendance'],
    activity: ['view.activity', 'subtitle.preview'],
    'shift-check': ['view.shiftCheck', 'subtitle.preview'],
    'payroll-period': ['view.payrollPeriod', 'subtitle.payrollPeriod'],
    'payroll-history': ['view.paymentHistory', 'subtitle.preview'],
    'report-workforce': ['view.reportWorkforce', 'subtitle.preview'],
    'report-recruitment': ['view.reportRecruitment', 'subtitle.preview'],
    'report-attendance': ['view.reportAttendance', 'subtitle.preview'],
    'report-activity': ['view.reportActivity', 'subtitle.preview'],
    'report-performance': ['view.reportPerformance', 'subtitle.preview'],
    'report-payroll': ['view.reportPayroll', 'subtitle.preview'],
    'report-retention': ['view.reportRetention', 'subtitle.preview'],
    performance: ['view.reportPerformance', 'subtitle.preview'],
    retention: ['view.reportRetention', 'subtitle.preview'],
    'master-data': ['view.masterData', 'subtitle.preview']
  };

  const PREVIEW_RULES = {
    applicants: 'RECRUITMENT_ENABLED',
    interviews: 'RECRUITMENT_ENABLED',
    staffing: 'RECRUITMENT_ENABLED',
    onboarding: 'RECRUITMENT_ENABLED',
    'report-recruitment': 'RECRUITMENT_ENABLED',
    activity: 'ACTIVITY_ENABLED',
    'report-activity': 'ACTIVITY_ENABLED',
    performance: 'PERFORMANCE_ENABLED',
    'report-performance': 'PERFORMANCE_ENABLED',
    offboarding: 'OFFBOARDING_ENABLED',
    retention: 'OFFBOARDING_ENABLED',
    'report-retention': 'OFFBOARDING_ENABLED',
    'employee-documents': 'GCS_DOCUMENTS_ENABLED'
  };

  const ALWAYS_PREVIEW = new Set([
    'shift-check', 'payroll-history', 'report-workforce', 'report-attendance',
    'report-payroll', 'master-data'
  ]);

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
    });
  }

  function locale() { return I18N.getLanguage() === 'en' ? 'en-US' : 'th-TH'; }
  function formatNumber(value) { return Number(value || 0).toLocaleString(locale(), { maximumFractionDigits: 2 }); }
  function formatPercent(value) { return value == null ? t('common.notAvailable') : formatNumber(value) + '%'; }
  function rowsOf(result) { return Array.isArray(result && result.rows) ? result.rows : []; }
  function valueOf(value, fallback) { return value === undefined || value === null || value === '' ? fallback : value; }

  function translateStatus(status) {
    const normalized = String(status || '').toLowerCase();
    const aliases = {
      unread: 'review', open: 'open', active: 'active', inactive: 'inactive', pending: 'pending',
      approved: 'approved', rejected: 'rejected', submitted: 'submitted', review: 'review',
      completed: 'completed', done: 'completed', draft: 'draft', paid: 'paid', closed: 'closed',
      verified: 'approved', passed: 'approved', accepted: 'approved', issue: 'review', preview: 'preview',
      unread: 'unread', normal: 'normal', late: 'late', no_checkout: 'noCheckout',
      not_checked_in: 'notCheckedIn', absent: 'absent', leave: 'leave', unplanned: 'unplanned',
      urgent: 'urgent', high: 'high', medium: 'medium', low: 'low', probation: 'probation'
    };
    const key = aliases[normalized] || aliases[normalized.replace(/[^a-z_]/g, '')];
    return key ? t('status.' + key) : String(status || t('common.notAvailable'));
  }

  function badge(status) {
    const raw = String(status || '');
    const good = /ACTIVE|HIRED|ACCEPTED|PASSED|DONE|VERIFIED|APPROVED|PAID|COMPLETED/i.test(raw);
    const bad = /REJECTED|DECLINED|CANCELLED|NO_SHOW|ISSUE/i.test(raw);
    return '<span class="badge ' + (good ? 'ok' : bad ? 'bad' : 'warn') + '">' + esc(translateStatus(raw)) + '</span>';
  }

  function metric(labelKey, value, meta) {
    return '<div class="card"><div class="metricLabel">' + esc(t(labelKey)) + '</div><div class="metric">' + esc(valueOf(value, t('common.notAvailable'))) + '</div><div class="metricMeta">' + esc(meta || '') + '</div></div>';
  }

  function flowLabel(key) { return '<div class="flowLabel">' + esc(t(key)) + '</div>'; }
  function section(titleKey, body) {
    return '<section class="section"><div class="sectionHead"><h2>' + esc(t(titleKey)) + '</h2></div>' + body + '</section>';
  }

  function loading() {
    app.className = '';
    app.innerHTML = '<div class="sr" role="status">' + esc(t('common.loading')) + '</div>' +
      flowLabel('summary.title') + '<div class="skeletonGrid">' + '<div class="skeleton skeletonCard"></div>'.repeat(4) + '</div>' +
      flowLabel('detail.title') + '<section class="section"><div class="skeleton skeletonLine short"></div><div class="skeleton skeletonLine"></div><div class="skeleton skeletonLine"></div><div class="skeleton skeletonLine"></div></section>';
  }

  function showError(error, retry) {
    const message = error && error.message ? error.message : String(error || '');
    app.className = '';
    app.innerHTML = '<div class="error" role="alert"><strong>' + esc(t('common.error')) + '</strong><div>' + esc(message || t('common.errorHint')) + '</div>' +
      '<button class="btn" type="button" id="retryButton">' + esc(t('common.retry')) + '</button></div>';
    document.getElementById('retryButton').onclick = retry;
  }

  function getToken() {
    const session = sessionStorage.getItem(SESSION_KEY) || '';
    if (session) return session;
    const persisted = localStorage.getItem(PERSIST_KEY) || '';
    const expiry = Number(localStorage.getItem(EXPIRY_KEY) || 0);
    return persisted && expiry > Date.now() ? persisted : '';
  }

  function call(op, data) {
    return api.call(Object.assign({ op: op, adminToken: token }, data || {}));
  }

  function updateHeading() {
    const meta = VIEW_META[view] || ['app.name', 'subtitle.preview'];
    document.getElementById('title').textContent = t(meta[0]);
    document.getElementById('subtitle').textContent = t(meta[1]);
    document.getElementById('env').textContent = isStaging ? 'STAGING' : 'PRODUCTION';
    document.title = t(meta[0]) + ' · ' + t('app.name');
  }

  function previewView() {
    const titleKey = (VIEW_META[view] || ['app.name'])[0];
    const samples = [
      { item: t('sample.record1'), owner: t('sample.owner'), status: 'PENDING' },
      { item: t('sample.record2'), owner: t('sample.owner'), status: 'PREVIEW' }
    ];
    app.className = '';
    app.innerHTML = '<div class="previewBanner"><div class="previewIcon">UAT</div><div><strong>' + esc(t('preview.label')) + '</strong><div>' + esc(t('preview.body')) + '</div></div></div>' +
      flowLabel('summary.title') + '<div class="grid">' +
      metric('metric.previewRecords', samples.length, t('preview.sampleData')) +
      metric('common.pending', 1, t('common.preview')) +
      metric('common.completed', 0, t('common.preview')) +
      metric('common.readOnly', '100%', t('preview.noWrite')) + '</div>' +
      flowLabel('action.title') + '<section class="section"><div class="toolbar">' +
      '<label class="sr" for="previewSearch">' + esc(t('common.search')) + '</label><input class="input" id="previewSearch" disabled placeholder="' + esc(t('common.searchPlaceholder')) + '">' +
      '<select class="select" disabled><option>' + esc(t('common.allStatuses')) + '</option></select>' +
      '<button class="btn primary" type="button" disabled>' + esc(t('preview.actionDisabled')) + '</button></div></section>' +
      flowLabel('detail.title') + section(titleKey, '<div class="tableWrap"><table><thead><tr><th>' + esc(t('table.item')) + '</th><th>' + esc(t('table.owner')) + '</th><th>' + esc(t('table.status')) + '</th><th>' + esc(t('table.action')) + '</th></tr></thead><tbody>' +
      samples.map(function (row, index) { return '<tr><td><button class="rowButton" type="button" data-preview-row="' + index + '">' + esc(row.item) + '</button><div class="metricMeta">' + esc(t('preview.sampleData')) + '</div></td><td>' + esc(row.owner) + '</td><td>' + badge(row.status) + '</td><td><button class="btn small" type="button" data-preview-row="' + index + '">' + esc(t('common.viewDetail')) + '</button></td></tr>'; }).join('') +
      '</tbody></table></div>');
    app.querySelectorAll('[data-preview-row]').forEach(function (button) {
      button.onclick = function () {
        const row = samples[Number(button.dataset.previewRow)];
        openDrawer(row.item, [
          [t('table.module'), t(titleKey)],
          [t('table.owner'), row.owner],
          [t('table.status'), translateStatus(row.status)],
          [t('detail.title'), t('drawer.preview')]
        ]);
      };
    });
  }

  function openDrawer(title, fields) {
    document.getElementById('drawerTitle').textContent = title || t('drawer.title');
    document.getElementById('drawerBody').innerHTML = fields.map(function (field) {
      return '<dt>' + esc(field[0]) + '</dt><dd>' + esc(valueOf(field[1], t('common.notAvailable'))) + '</dd>';
    }).join('');
    document.getElementById('drawerBackdrop').hidden = false;
    document.getElementById('drawerClose').focus();
  }

  function bindRowDetails(container, rows, fieldMap) {
    container.querySelectorAll('[data-row-index]').forEach(function (button) {
      button.onclick = function () {
        const row = rows[Number(button.dataset.rowIndex)] || {};
        openDrawer(valueOf(row.title || row.employeeName || row['Period ID'], t('drawer.title')), fieldMap.map(function (field) {
          return [t(field[0]), row[field[1]]];
        }));
      };
    });
  }

  async function renderDashboard() {
    loading();
    try {
      const d = await call('adminWorkforceDashboard');
      const workforce = d.workforce || {};
      const workQueue = d.workQueue || {};
      const recruitment = d.recruitment || {};
      app.innerHTML = flowLabel('summary.title') + '<div class="grid">' +
        metric('metric.activeEmployees', workforce.active, 'Active') +
        metric('metric.pendingItems', workQueue.open, t('common.attention') + ' ' + formatNumber(workQueue.urgent)) +
        metric('metric.todayAttendance', valueOf(d.attendance && d.attendance.present, t('common.notAvailable')), t('common.updatedAt')) +
        metric('metric.openPositions', valueOf(recruitment.openPositions, t('common.notAvailable')), t('common.readOnly')) + '</div>' +
        flowLabel('action.title') + '<section class="section"><div class="toolbar"><button class="btn" type="button" id="dashboardRefresh">' + esc(t('common.refresh')) + '</button><span class="metricMeta">' + esc(t('common.readOnly')) + '</span></div></section>' +
        flowLabel('detail.title') + section('view.overview', '<div class="tableWrap"><table><thead><tr><th>' + esc(t('table.module')) + '</th><th>' + esc(t('common.total')) + '</th><th>' + esc(t('table.status')) + '</th></tr></thead><tbody>' +
        '<tr><td>' + esc(t('view.employees')) + '</td><td>' + esc(valueOf(workforce.total, 0)) + '</td><td>' + badge('ACTIVE') + '</td></tr>' +
        '<tr><td>' + esc(t('view.review')) + '</td><td>' + esc(valueOf(workQueue.open, 0)) + '</td><td>' + badge(Number(workQueue.open || 0) ? 'REVIEW' : 'COMPLETED') + '</td></tr>' +
        '<tr><td>' + esc(t('view.applicants')) + '</td><td>' + esc(valueOf(recruitment.applicants, 0)) + '</td><td>' + badge('PREVIEW') + '</td></tr>' +
        '</tbody></table></div>');
      document.getElementById('dashboardRefresh').onclick = renderDashboard;
    } catch (error) { showError(error, renderDashboard); }
  }

  async function renderQueue() {
    loading();
    try {
      const result = await call('adminGetWorkQueue', { status: 'OPEN', limit: 100 });
      const rows = rowsOf(result);
      app.innerHTML = flowLabel('summary.title') + '<div class="grid">' +
        metric('metric.pendingItems', rows.length, t('common.readOnly')) +
        metric('common.attention', rows.filter(function (row) { return /URGENT|HIGH/i.test(row.priority || ''); }).length, t('view.review')) +
        metric('common.completed', 0, t('common.readOnly')) +
        metric('common.total', rows.length, t('common.updatedAt')) + '</div>' +
        flowLabel('action.title') + '<section class="section"><div class="toolbar"><input class="input" id="queueSearch" placeholder="' + esc(t('common.searchPlaceholder')) + '"><button class="btn" id="queueRefresh" type="button">' + esc(t('common.refresh')) + '</button></div></section>' +
        flowLabel('detail.title') + '<section class="section" id="queueDetail"></section>';
      const detail = document.getElementById('queueDetail');
      function draw(query) {
        const term = String(query || '').trim().toLowerCase();
        const filtered = rows.filter(function (row) { return !term || JSON.stringify(row).toLowerCase().includes(term); });
        if (!filtered.length) { detail.innerHTML = '<div class="empty">' + esc(t('common.noData')) + '</div>'; return; }
        detail.innerHTML = '<div class="tableWrap"><table><thead><tr><th>' + esc(t('table.item')) + '</th><th>' + esc(t('table.branch')) + '</th><th>' + esc(t('table.date')) + '</th><th>' + esc(t('table.status')) + '</th><th>' + esc(t('table.action')) + '</th></tr></thead><tbody>' +
          filtered.map(function (row, index) { return '<tr><td><strong>' + esc(row.title) + '</strong><div class="metricMeta">' + esc(row.entityType) + ' · ' + esc(row.entityId) + '</div></td><td>' + esc(valueOf(row.branchCode, t('common.notAvailable'))) + '</td><td>' + esc(valueOf(row.dueAt, t('common.notAvailable'))) + '</td><td>' + badge(row.status || row.priority) + '</td><td><button class="btn small" type="button" data-row-index="' + index + '">' + esc(t('common.viewDetail')) + '</button></td></tr>'; }).join('') + '</tbody></table></div>';
        bindRowDetails(detail, filtered, [['table.item', 'title'], ['table.branch', 'branchCode'], ['table.department', 'departmentCode'], ['table.status', 'status']]);
      }
      draw('');
      let timer;
      document.getElementById('queueSearch').oninput = function (event) { clearTimeout(timer); timer = setTimeout(function () { draw(event.target.value); }, 250); };
      document.getElementById('queueRefresh').onclick = renderQueue;
    } catch (error) { showError(error, renderQueue); }
  }

  async function renderNotifications() {
    loading();
    try {
      const result = await call('adminGetNotificationCenter');
      const rows = rowsOf(result);
      const unread = Number(result.unread || rows.filter(function (row) { return row.status === 'UNREAD'; }).length);
      app.innerHTML = flowLabel('summary.title') + '<div class="grid">' +
        metric('metric.unread', unread, t('common.readOnly')) + metric('common.total', rows.length, t('view.notifications')) +
        metric('common.completed', Math.max(0, rows.length - unread), t('common.readOnly')) + metric('common.attention', unread, t('view.review')) + '</div>' +
        flowLabel('action.title') + '<section class="section"><div class="toolbar"><button class="btn" id="notificationRefresh" type="button">' + esc(t('common.refresh')) + '</button><span class="metricMeta">' + esc(t('preview.noWrite')) + '</span></div></section>' +
        flowLabel('detail.title') + section('view.notifications', rows.length ? '<div class="tableWrap"><table><thead><tr><th>' + esc(t('table.date')) + '</th><th>' + esc(t('table.message')) + '</th><th>' + esc(t('table.status')) + '</th></tr></thead><tbody>' +
        rows.map(function (row) { return '<tr><td>' + esc(row.createdAt) + '</td><td><strong>' + esc(row.title) + '</strong><div class="metricMeta">' + esc(row.message) + '</div></td><td>' + badge(row.status) + '</td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">' + esc(t('common.noData')) + '</div>');
      document.getElementById('notificationRefresh').onclick = renderNotifications;
    } catch (error) { showError(error, renderNotifications); }
  }

  async function renderAttendance() {
    const requestId = ++renderSequence;
    const today = new Date().toISOString().slice(0, 10);
    app.innerHTML = flowLabel('summary.title') + '<div id="attendanceSummary" class="skeletonGrid">' + '<div class="skeleton skeletonCard"></div>'.repeat(4) + '</div>' +
      flowLabel('action.title') + '<section class="section"><div class="toolbar"><input class="input" id="attendanceDate" type="date" value="' + today + '">' +
      '<select class="select" id="attendanceBranch"><option value="">' + esc(t('common.allBranches')) + '</option>' + (bootstrap.branches || []).map(function (item) { return '<option value="' + esc(item.code) + '">' + esc(item.name) + '</option>'; }).join('') + '</select>' +
      '<select class="select" id="attendanceDepartment"><option value="">' + esc(t('common.allDepartments')) + '</option>' + (bootstrap.departments || []).map(function (item) { return '<option value="' + esc(item.code) + '">' + esc(item.name) + '</option>'; }).join('') + '</select>' +
      '<input class="input" id="attendanceSearch" placeholder="' + esc(t('common.searchPlaceholder')) + '"><button class="btn" id="attendanceLoad" type="button">' + esc(t('common.refresh')) + '</button></div></section>' +
      flowLabel('detail.title') + '<section class="section" id="attendanceDetail"><div class="skeleton skeletonLine"></div><div class="skeleton skeletonLine"></div></section>';

    async function load() {
      const ownRequest = ++renderSequence;
      const summaryBox = document.getElementById('attendanceSummary');
      const detailBox = document.getElementById('attendanceDetail');
      if (!summaryBox || !detailBox) return;
      detailBox.innerHTML = '<div class="skeleton skeletonLine"></div><div class="skeleton skeletonLine"></div>';
      try {
        const result = await call('adminAttendanceControl', {
          date: document.getElementById('attendanceDate').value,
          branchCode: document.getElementById('attendanceBranch').value,
          departmentCode: document.getElementById('attendanceDepartment').value,
          employeeQuery: document.getElementById('attendanceSearch').value,
          status: ''
        });
        if (ownRequest !== renderSequence) return;
        const summary = result.summary || {};
        const rows = rowsOf(result);
        summaryBox.className = 'grid';
        summaryBox.innerHTML = metric('common.total', summary.expected, t('view.attendance')) +
          metric('metric.todayAttendance', summary.present, t('status.active')) +
          metric('common.attention', Number(summary.absent || 0) + Number(summary.noCheckOut || 0), t('view.review')) +
          metric('common.pending', summary.notCheckedIn, t('view.attendance'));
        detailBox.innerHTML = rows.length ? '<div class="tableWrap"><table><thead><tr><th>' + esc(t('table.employee')) + '</th><th>' + esc(t('table.branch')) + '</th><th>' + esc(t('table.time')) + '</th><th>' + esc(t('table.status')) + '</th><th>' + esc(t('table.action')) + '</th></tr></thead><tbody>' +
          rows.map(function (row, index) { return '<tr><td><strong>' + esc(row.employeeName) + '</strong><div class="metricMeta">' + esc(row.employeeId) + ' · ' + esc(row.nickname) + '</div></td><td>' + esc(row.branchCode) + '<div class="metricMeta">' + esc(row.departmentCode) + '</div></td><td>' + esc(valueOf(row.checkIn, '—')) + ' – ' + esc(valueOf(row.checkOut, '—')) + '</td><td>' + badge(row.status) + '</td><td><button class="btn small" type="button" data-row-index="' + index + '">' + esc(t('common.viewDetail')) + '</button></td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">' + esc(t('common.noData')) + '</div>';
        bindRowDetails(detailBox, rows, [['table.employee', 'employeeName'], ['table.branch', 'branchCode'], ['table.department', 'departmentCode'], ['table.status', 'status']]);
      } catch (error) {
        if (ownRequest !== renderSequence) return;
        detailBox.innerHTML = '<div class="error"><strong>' + esc(t('common.error')) + '</strong><div>' + esc(error.message || error) + '</div><button class="btn" id="attendanceRetry" type="button">' + esc(t('common.retry')) + '</button></div>';
        document.getElementById('attendanceRetry').onclick = load;
      }
    }

    document.getElementById('attendanceLoad').onclick = load;
    document.getElementById('attendanceDate').onchange = load;
    document.getElementById('attendanceBranch').onchange = load;
    document.getElementById('attendanceDepartment').onchange = load;
    let timer;
    document.getElementById('attendanceSearch').oninput = function () { clearTimeout(timer); timer = setTimeout(load, 350); };
    if (requestId <= renderSequence) await load();
  }

  async function renderPayrollPeriods() {
    loading();
    try {
      const result = await call('adminGetPayrollPeriods');
      const rows = rowsOf(result);
      const total = rows.reduce(function (sum, row) { return sum + Number(row['Total Amount'] || 0); }, 0);
      app.innerHTML = flowLabel('summary.title') + '<div class="grid">' +
        metric('metric.periods', rows.length, t('common.readOnly')) + metric('table.amount', formatNumber(total), t('view.payrollPeriod')) +
        metric('common.completed', rows.filter(function (row) { return /PAID|CLOSED|COMPLETED/i.test(row.Status || ''); }).length, t('common.total')) +
        metric('common.pending', rows.filter(function (row) { return !/PAID|CLOSED|COMPLETED/i.test(row.Status || ''); }).length, t('common.total')) + '</div>' +
        flowLabel('action.title') + '<section class="section"><div class="toolbar"><button class="btn" id="payrollRefresh" type="button">' + esc(t('common.refresh')) + '</button><span class="metricMeta">' + esc(t('preview.noWrite')) + '</span></div></section>' +
        flowLabel('detail.title') + section('view.payrollPeriod', rows.length ? '<div class="tableWrap"><table><thead><tr><th>' + esc(t('table.period')) + '</th><th>' + esc(t('table.date')) + '</th><th>' + esc(t('table.employee')) + '</th><th>' + esc(t('table.amount')) + '</th><th>' + esc(t('table.status')) + '</th><th>' + esc(t('table.action')) + '</th></tr></thead><tbody>' +
        rows.map(function (row, index) { return '<tr><td><strong>' + esc(row['Period ID']) + '</strong></td><td>' + esc(row['Start Date']) + ' – ' + esc(row['End Date']) + '</td><td>' + esc(row['Employee Count']) + '</td><td>' + esc(formatNumber(row['Total Amount'])) + '</td><td>' + badge(row.Status) + '</td><td><button class="btn small" type="button" data-row-index="' + index + '">' + esc(t('common.viewDetail')) + '</button></td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">' + esc(t('common.noData')) + '</div>');
      bindRowDetails(app, rows, [['table.period', 'Period ID'], ['table.date', 'Pay Date'], ['table.amount', 'Total Amount'], ['table.status', 'Status']]);
      document.getElementById('payrollRefresh').onclick = renderPayrollPeriods;
    } catch (error) { showError(error, renderPayrollPeriods); }
  }

  function shouldPreview() {
    if (ALWAYS_PREVIEW.has(view)) return true;
    const flag = PREVIEW_RULES[view];
    return Boolean(flag && !(bootstrap.flags || {})[flag]);
  }

  async function renderCurrentView() {
    updateHeading();
    if (shouldPreview()) return previewView();
    if (view === 'dashboard') return renderDashboard();
    if (view === 'work-queue') return renderQueue();
    if (view === 'notifications') return renderNotifications();
    if (view === 'attendance') return renderAttendance();
    if (view === 'payroll-period') return renderPayrollPeriods();
    return previewView();
  }

  async function start() {
    updateHeading();
    I18N.bindLanguageSwitchers(document);
    token = getToken();
    if (!token && parent !== window) {
      parent.postMessage({ type: 'KruaFlowAdminSessionRequest' }, location.origin);
      await new Promise(function (resolve) { setTimeout(resolve, 350); });
      token = getToken();
    }
    if (!token) {
      app.innerHTML = '<div class="error"><strong>' + esc(t('auth.missingSession')) + '</strong><div><a class="btn" href="./workspace.html' + (isStaging ? '?staging=1' : '') + '">' + esc(t('app.name')) + '</a></div></div>';
      return;
    }
    loading();
    try {
      bootstrap = await call('workforceBootstrap');
      if (!bootstrap.ready) { app.innerHTML = '<div class="notice"><strong>' + esc(t('schema.notReady')) + '</strong></div>'; return; }
      if (!(bootstrap.flags || {}).WORKFORCE_V2_ENABLED) { app.innerHTML = '<div class="notice"><strong>' + esc(t('schema.disabled')) + '</strong></div>'; return; }
      await renderCurrentView();
    } catch (error) { showError(error, start); }
  }

  document.getElementById('drawerClose').onclick = function () { document.getElementById('drawerBackdrop').hidden = true; };
  document.getElementById('drawerBackdrop').onclick = function (event) { if (event.target === event.currentTarget) event.currentTarget.hidden = true; };
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape') document.getElementById('drawerBackdrop').hidden = true; });
  window.addEventListener('message', function (event) {
    if (event.origin !== location.origin || !event.data || event.data.type !== 'KruaFlowAdminSession') return;
    if (event.data.token) sessionStorage.setItem(SESSION_KEY, event.data.token);
  });
  window.addEventListener('KruaFlowLanguageChange', function () { updateHeading(); if (bootstrap) renderCurrentView(); });
  start();
})();
</script>
</body>
</html>

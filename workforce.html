<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <title>KruaFlow ระบบบุคลากร</title>
  <script src="./config.js"></script>
  <script src="./mock-data.js"></script>
  <script src="./js/api-client.js"></script>
  <script src="./js/admin-session.js"></script>
  <script src="./js/i18n.js"></script>
  <script src="./js/registration-ui.js?v=registration-final-polish-1"></script>
  <link rel="stylesheet" href="./css/workforce.css">
  <link rel="stylesheet" href="./css/registration-mobile.css?v=registration-final-polish-1">
</head>
<body>
  <main class="page">
    <header class="head">
      <div>
        <h1 id="title">ภาพรวมระบบ</h1>
        <p class="subtitle" id="subtitle">สถานะกำลังคน งานค้าง และสัญญาณที่ต้องติดตาม</p>
      </div>
    </header>
    <div id="app" aria-live="polite"></div>
  </main>

  <div class="drawerBackdrop" id="drawerBackdrop" hidden>
    <aside class="drawer" role="dialog" aria-modal="true" aria-labelledby="drawerTitle">
      <div class="drawerHead">
        <div>
          <div class="metricMeta" data-i18n="detail.title">รายละเอียด</div>
          <h2 id="drawerTitle">รายละเอียดรายการ</h2>
        </div>
        <button class="btn small" type="button" id="drawerClose" data-i18n="common.close">ปิด</button>
      </div>
      <dl class="drawerGrid" id="drawerBody"></dl>
    </aside>
  </div>

<script>
(function () {
  'use strict';

  const I18N = window.KruaFlowI18n;
  const SESSION = window.KruaFlowAdminSession;
  const t = I18N.t;
  const params = new URLSearchParams(location.search);
  const view = params.get('view') || 'dashboard';
  const isStaging = params.get('staging') === '1';
  const configuredApiUrl = String((window.KRUA_FLOW_CONFIG || {})[isStaging ? 'STAGING_API_URL' : 'API_URL'] || '').split('?')[0];
  const backendReady = /^https:\/\/script\.google\.com\/macros\/s\/.+\/exec$/.test(configuredApiUrl);
  const app = document.getElementById('app');
  const api = backendReady ? new KruaFlowApi.Client({ url: configuredApiUrl, timeout: 30000 }) : null;
  let token = '';
  let bootstrap = null;
  let renderSequence = 0;
  let dashboardCache = null;
  let selectedRegistrationId = '';
  let registrationDetailSequence = 0;

  const VIEW_META = {
    dashboard: ['view.overview', 'subtitle.dashboardLive'],
    'work-queue': ['view.review', 'subtitle.queue'],
    notifications: ['view.notifications', 'subtitle.notifications'],
    registrations: ['view.employeeRegistration', 'subtitle.dashboardLive'],
    applicants: ['view.applicants', 'subtitle.preview'],
    interviews: ['view.interviews', 'subtitle.preview'],
    staffing: ['view.staffing', 'subtitle.preview'],
    onboarding: ['view.onboarding', 'subtitle.preview'],
    'employee-documents': ['view.employeeDocuments', 'subtitle.preview'],
    offboarding: ['view.offboarding', 'subtitle.preview'],
    attendance: ['view.attendance', 'subtitle.attendance'],
    activity: ['view.activity', 'subtitle.preview'],
    'shift-check': ['view.shiftCheck', 'subtitle.preview'],
    'payroll-period': ['view.payrollPeriod', 'subtitle.payrollPeriod'],
    'payroll-history': ['view.paymentHistory', 'subtitle.preview'],
    'report-workforce': ['view.reportWorkforce', 'subtitle.preview'],
    'report-recruitment': ['view.reportRecruitment', 'subtitle.preview'],
    'report-attendance': ['view.reportAttendance', 'subtitle.preview'],
    'report-leave': ['view.reportLeave', 'subtitle.preview'],
    'report-activity': ['view.reportActivity', 'subtitle.preview'],
    'report-performance': ['view.reportPerformance', 'subtitle.preview'],
    'report-payroll': ['view.reportPayroll', 'subtitle.preview'],
    'report-retention': ['view.reportRetention', 'subtitle.preview'],
    performance: ['view.performance', 'subtitle.preview'],
    retention: ['view.reportRetention', 'subtitle.preview'],
    'master-data': ['view.masterData', 'subtitle.preview'],
    recruitment: ['view.recruitment', 'subtitle.preview'],
    'probation-review': ['view.probationReview', 'subtitle.preview'],
    training: ['view.training', 'subtitle.preview'],
    incident: ['view.incident', 'subtitle.preview'],
    movement: ['view.movement', 'subtitle.preview'],
    'advanced-kpi': ['view.advancedKpi', 'subtitle.preview'],
    'advanced-reports': ['view.advancedReports', 'subtitle.preview']
  };

  const PREVIEW_RULES = {
    applicants: 'RECRUITMENT_ENABLED',
    interviews: 'RECRUITMENT_ENABLED',
    staffing: 'RECRUITMENT_ENABLED',
    onboarding: 'RECRUITMENT_ENABLED',
    'report-recruitment': 'RECRUITMENT_ENABLED',
    activity: 'ACTIVITY_ENABLED',
    'report-activity': 'ACTIVITY_ENABLED',
    performance: 'PERFORMANCE_ENABLED',
    'report-performance': 'PERFORMANCE_ENABLED',
    offboarding: 'OFFBOARDING_ENABLED',
    retention: 'OFFBOARDING_ENABLED',
    'report-retention': 'OFFBOARDING_ENABLED'
  };

  const ALWAYS_PREVIEW = new Set([
    'shift-check', 'payroll-history', 'report-workforce', 'report-attendance',
    'report-leave', 'report-payroll', 'master-data', 'recruitment',
    'probation-review', 'training', 'incident', 'movement', 'advanced-kpi', 'advanced-reports'
  ]);

  function esc(value) {
    return String(value == null ? '' : value).replace(/[&<>"']/g, function (char) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[char];
    });
  }

  function locale() { return I18N.getLanguage() === 'en' ? 'en-US' : 'th-TH'; }
  function formatNumber(value) { return Number(value || 0).toLocaleString(locale(), { maximumFractionDigits: 2 }); }
  function formatPercent(value) { return value == null ? t('common.notAvailable') : formatNumber(value) + '%'; }
  function rowsOf(result) { return Array.isArray(result && result.rows) ? result.rows : []; }
  function valueOf(value, fallback) { return value === undefined || value === null || value === '' ? fallback : value; }

  function translateStatus(status) {
    const normalized = String(status || '').toLowerCase();
    const aliases = {
      unread: 'review', open: 'open', active: 'active', inactive: 'inactive', pending: 'pending',
      approved: 'approved', rejected: 'rejected', submitted: 'submitted', review: 'review',
      completed: 'completed', done: 'completed', draft: 'draft', paid: 'paid', closed: 'closed',
      verified: 'approved', passed: 'approved', accepted: 'approved', issue: 'review', preview: 'preview',
      unread: 'unread', normal: 'normal', late: 'late', no_checkout: 'noCheckout',
      not_checked_in: 'notCheckedIn', absent: 'absent', leave: 'leave', unplanned: 'unplanned',
      urgent: 'urgent', high: 'high', medium: 'medium', low: 'low', probation: 'probation',
      final: 'final', hold: 'hold', dispute: 'disputed', disputed: 'disputed', employee_review: 'review',
      cancelled: 'cancelled', canceled: 'cancelled', no_show: 'cancelled', ready: 'ready', accept: 'accepted'
    };
    const key = aliases[normalized] || aliases[normalized.replace(/[^a-z_]/g, '')];
    if (key) return t('status.' + key);
    if (!status) return t('common.notAvailable');
    return I18N.getLanguage() === 'th' ? t('status.unknown') : String(status);
  }

  function badge(status) {
    const raw = String(status || '');
    const good = /ACTIVE|HIRED|ACCEPTED|PASSED|DONE|VERIFIED|APPROVED|PAID|COMPLETED/i.test(raw);
    const bad = /REJECTED|DECLINED|CANCELLED|NO_SHOW|ISSUE/i.test(raw);
    return '<span class="badge ' + (good ? 'ok' : bad ? 'bad' : 'warn') + '">' + esc(translateStatus(raw)) + '</span>';
  }

  function metric(labelKey, value, meta) {
    return '<div class="card"><div class="metricLabel">' + esc(t(labelKey)) + '</div><div class="metric">' + esc(valueOf(value, t('common.notAvailable'))) + '</div><div class="metricMeta">' + esc(meta || '') + '</div></div>';
  }

  function flowLabel(key) { return '<div class="flowLabel">' + esc(t(key)) + '</div>'; }
  function section(titleKey, body) {
    return '<section class="section"><div class="sectionHead"><h2>' + esc(t(titleKey)) + '</h2></div>' + body + '</section>';
  }

  function loading() {
    app.className = '';
    app.innerHTML = '<div class="sr" role="status">' + esc(t('common.loading')) + '</div>' +
      flowLabel('summary.title') + '<div class="skeletonGrid">' + '<div class="skeleton skeletonCard"></div>'.repeat(4) + '</div>' +
      flowLabel('detail.title') + '<section class="section"><div class="skeleton skeletonLine short"></div><div class="skeleton skeletonLine"></div><div class="skeleton skeletonLine"></div><div class="skeleton skeletonLine"></div></section>';
  }

  function showError(error, retry) {
    const message = I18N.errorText(error);
    app.className = '';
    app.innerHTML = '<div class="error" role="alert"><strong>' + esc(t('common.error')) + '</strong><div>' + esc(message || t('common.errorHint')) + '</div>' +
      '<button class="btn" type="button" id="retryButton">' + esc(t('common.retry')) + '</button></div>';
    document.getElementById('retryButton').onclick = retry;
  }

  function getToken() { return SESSION.get(); }

  function notifySessionExpired() {
    SESSION.clear();
    token = '';
    bootstrap = null;
    if (parent !== window) parent.postMessage({ type: 'KruaFlowAdminSessionExpired' }, location.origin);
  }

  function call(op, data) {
    return api.call(Object.assign({ op: op, adminToken: token }, data || {})).then(function (result) {
      SESSION.touch();
      if (parent !== window) parent.postMessage({ type: 'KruaFlowAdminSessionActive' }, location.origin);
      return result;
    }).catch(function (error) {
      if (SESSION.isAuthError(error)) notifySessionExpired();
      throw error;
    });
  }

  function updateHeading() {
    const meta = VIEW_META[view] || ['app.name', 'subtitle.preview'];
    document.getElementById('title').textContent = t(meta[0]);
    document.getElementById('subtitle').textContent = t(meta[1]);
    document.title = t(meta[0]) + ' · ' + t('app.name');
  }

  function previewView() {
    const titleKey = (VIEW_META[view] || ['app.name'])[0];
    const samples = [
      { item: t('sample.record1'), owner: t('sample.owner'), status: 'PENDING' },
      { item: t('sample.record2'), owner: t('sample.owner'), status: 'PREVIEW' }
    ];
    app.className = '';
    app.innerHTML = '<div class="previewBanner"><div class="previewIcon">…</div><div><strong>' + esc(t('preview.label')) + '</strong><div>' + esc(t('preview.body')) + '</div></div></div>' +
      flowLabel('summary.title') + '<div class="grid">' +
      metric('metric.previewRecords', samples.length, t('preview.sampleData')) +
      metric('common.pending', 1, t('common.preview')) +
      metric('common.completed', 0, t('common.preview')) +
      metric('common.readOnly', '100%', t('preview.noWrite')) + '</div>' +
      flowLabel('action.title') + '<section class="section"><div class="toolbar">' +
      '<label class="sr" for="previewSearch">' + esc(t('common.search')) + '</label><input class="input" id="previewSearch" disabled placeholder="' + esc(t('common.searchPlaceholder')) + '">' +
      '<select class="select" disabled><option>' + esc(t('common.allStatuses')) + '</option></select>' +
      '<button class="btn primary" type="button" disabled>' + esc(t('preview.actionDisabled')) + '</button></div></section>' +
      flowLabel('detail.title') + section(titleKey, '<div class="tableWrap"><table><thead><tr><th>' + esc(t('table.item')) + '</th><th>' + esc(t('table.owner')) + '</th><th>' + esc(t('table.status')) + '</th><th>' + esc(t('table.action')) + '</th></tr></thead><tbody>' +
      samples.map(function (row, index) { return '<tr><td><button class="rowButton" type="button" data-preview-row="' + index + '">' + esc(row.item) + '</button><div class="metricMeta">' + esc(t('preview.sampleData')) + '</div></td><td>' + esc(row.owner) + '</td><td>' + badge(row.status) + '</td><td><button class="btn small" type="button" data-preview-row="' + index + '">' + esc(t('common.viewDetail')) + '</button></td></tr>'; }).join('') +
      '</tbody></table></div>');
    app.querySelectorAll('[data-preview-row]').forEach(function (button) {
      button.onclick = function () {
        const row = samples[Number(button.dataset.previewRow)];
        openDrawer(row.item, [
          [t('table.module'), t(titleKey)],
          [t('table.owner'), row.owner],
          [t('table.status'), translateStatus(row.status)],
          [t('detail.title'), t('drawer.preview')]
        ]);
      };
    });
  }

  function openDrawer(title, fields) {
    document.getElementById('drawerTitle').textContent = title || t('drawer.title');
    document.getElementById('drawerBody').innerHTML = fields.map(function (field) {
      return '<dt>' + esc(field[0]) + '</dt><dd>' + esc(valueOf(field[1], t('common.notAvailable'))) + '</dd>';
    }).join('');
    document.getElementById('drawerBackdrop').hidden = false;
    document.getElementById('drawerClose').focus();
  }

  function registrationDocumentBadge(state) {
    const status = String(state && state.status || 'INCOMPLETE').toUpperCase();
    if (status === 'COMPLETE') return '<span class="badge ok">ครบ</span>';
    if (status === 'ISSUE') return '<span class="badge bad">มีปัญหา</span>';
    return '<span class="badge warn">ไม่ครบ</span>';
  }

  function registrationMetric(kind, label, value, meta) {
    return '<div class="card registrationMetric ' + esc(kind) + '"><div class="registrationMetricLabel">' + esc(label) + '</div><div class="registrationMetricNumber">' + esc(value) + '</div><div class="registrationMetricMeta">' + esc(meta) + '</div></div>';
  }

  function registrationStatusBadge(status) {
    const value = String(status || 'DRAFT').toUpperCase();
    if (['APPROVED','ACTIVE','COMPLETED'].indexOf(value) >= 0) return '<span class="badge registrationStatus complete">✓ ' + esc(value === 'APPROVED' ? 'อนุมัติแล้ว' : 'เสร็จสมบูรณ์') + '</span>';
    if (value === 'PENDING') return '<span class="badge registrationStatus pending">รอตรวจ</span>';
    if (value === 'DRAFT') return '<span class="badge registrationStatus draft">แบบร่าง</span>';
    if (/ERROR|REJECT|ISSUE|FAILED/.test(value)) return '<span class="badge registrationStatus error">มีปัญหา</span>';
    return '<span class="badge registrationStatus active">' + esc(value || '—') + '</span>';
  }

  function registrationDocumentStatusBadge(status) {
    const value = String(status || '').toUpperCase();
    if (['ACTIVE','VERIFIED'].indexOf(value) >= 0) return '<span class="badge registrationStatus complete">✓ พร้อมใช้งาน</span>';
    if (value === 'PENDING_UPLOAD') return '<span class="badge registrationStatus pending">อัปโหลดไม่สมบูรณ์</span>';
    if (value === 'REPLACED') return '<span class="badge registrationStatus replaced">ถูกแทนที่</span>';
    if (/ERROR|REJECT|ISSUE|FAILED/.test(value)) return '<span class="badge registrationStatus error">มีปัญหา</span>';
    return '<span class="badge registrationStatus draft">' + esc(value || 'ไม่มีข้อมูล') + '</span>';
  }

  function employeeRegistrationUrl() {
    const url = new URL('./register.html', location.href);
    url.search = '';
    if (isStaging) url.searchParams.set('staging', '1');
    url.hash = '';
    return url.href;
  }

  function registrationSharePanel() {
    const url = employeeRegistrationUrl();
    return '<section class="registrationShare" aria-labelledby="registrationShareTitle"><div class="registrationShareHead"><div><h2 id="registrationShareTitle">ส่งลิงก์ลงทะเบียนให้พนักงาน</h2><p>พนักงานเปิดลิงก์นี้บนโทรศัพท์เพื่อกรอกข้อมูลและแนบเอกสารด้วยตนเอง</p></div></div><div class="registrationShareBody"><div><input class="registrationShareUrl" id="registrationShareUrl" readonly value="' + esc(url) + '" aria-label="ลิงก์ลงทะเบียนพนักงาน"><div class="registrationShareActions"><button class="btn small primary" id="registrationCopyLink" type="button">คัดลอกลิงก์</button><button class="btn small lineShare" id="registrationLineShare" type="button">ส่งผ่าน LINE</button><button class="btn small" id="registrationNativeShare" type="button">แชร์</button></div><div class="registrationShareFeedback" id="registrationShareFeedback" role="status" aria-live="polite"></div></div><div class="registrationQr"><canvas id="registrationQrCanvas"></canvas></div></div></section>';
  }

  function bindRegistrationShare() {
    const url = employeeRegistrationUrl();
    const feedback = document.getElementById('registrationShareFeedback');
    const tools = window.KruaFlowRegistrationUI || {};
    try {
      if (!tools.renderQr || !tools.renderQr(document.getElementById('registrationQrCanvas'), url)) throw new Error('QR unavailable');
    } catch (_) {
      const holder = document.querySelector('.registrationQr');
      if (holder) holder.innerHTML = '<span class="metricMeta">สร้าง QR ไม่สำเร็จ</span>';
    }
    document.getElementById('registrationCopyLink').onclick = async function () {
      try { await tools.copyText(url); feedback.textContent = 'คัดลอกลิงก์แล้ว'; }
      catch (_) { feedback.textContent = 'คัดลอกไม่สำเร็จ กรุณาเลือกลิงก์ด้านบนแล้วคัดลอก'; }
    };
    document.getElementById('registrationLineShare').onclick = function () {
      const message = 'กรุณาเปิดลิงก์นี้เพื่อลงทะเบียนพนักงาน KruaFlow\n' + url;
      window.open('https://line.me/R/msg/text/?' + encodeURIComponent(message), '_blank', 'noopener');
    };
    document.getElementById('registrationNativeShare').onclick = async function () {
      try {
        if (navigator.share) await navigator.share({ title:'แบบลงทะเบียนพนักงาน KruaFlow', text:'กรุณาเปิดลิงก์นี้เพื่อลงทะเบียนพนักงาน', url:url });
        else { await tools.copyText(url); feedback.textContent = 'อุปกรณ์นี้ไม่มีเมนูแชร์ จึงคัดลอกลิงก์ให้แล้ว'; }
      } catch (error) {
        if (!error || error.name !== 'AbortError') feedback.textContent = 'ยังแชร์ไม่ได้ กรุณาใช้ปุ่มคัดลอกลิงก์';
      }
    };
  }

  function formatFileSize(value) {
    const bytes = Number(value) || 0;
    if (!bytes) return '—';
    if (bytes < 1024) return bytes + ' B';
    if (bytes < 1048576) return (bytes / 1024).toFixed(1) + ' KB';
    return (bytes / 1048576).toFixed(1) + ' MB';
  }

  function registrationDocumentPriority(document) {
    const status = String(document && document.status || '').toUpperCase();
    if (status === 'VERIFIED') return 3;
    if (status === 'ACTIVE') return 2;
    return 1;
  }

  function registrationDocumentTime(document) {
    const raw = document && (document.verifiedAt || document.uploadedAt || document.updatedAt || document.createdAt) || '';
    const parsed = Date.parse(raw);
    return Number.isFinite(parsed) ? parsed : 0;
  }

  function groupRegistrationDocuments(documents, types) {
    return types.map(function (spec) {
      const matches = documents.map(function (document, index) { return { document:document, index:index }; }).filter(function (item) {
        return String(item.document.type || '').toUpperCase() === spec.type;
      });
      const ranked = matches.slice().sort(function (left, right) {
        return registrationDocumentPriority(right.document) - registrationDocumentPriority(left.document) ||
          registrationDocumentTime(right.document) - registrationDocumentTime(left.document) || left.index - right.index;
      });
      const selected = ranked[0] || null;
      return {
        spec:spec,
        current:selected && selected.document || null,
        history:matches.filter(function (item) { return !selected || item.index !== selected.index; }).map(function (item) { return item.document; })
      };
    });
  }

  function registrationDocumentStateFromCurrent(groups) {
    const required = groups.filter(function (group) { return group.spec.required; });
    const ready = function (group) { return group.current && ['ACTIVE','VERIFIED'].indexOf(String(group.current.status || '').toUpperCase()) >= 0; };
    if (required.every(ready)) return { status:'COMPLETE' };
    const issue = required.some(function (group) { return group.current && /ERROR|REJECT|ISSUE|FAILED/.test(String(group.current.status || '').toUpperCase()); });
    return { status:issue ? 'ISSUE' : 'INCOMPLETE' };
  }

  function registrationHistoryStatusBadge(status) {
    const value = String(status || 'UNKNOWN').toUpperCase();
    const tone = ['ACTIVE','VERIFIED'].indexOf(value) >= 0 ? 'complete' : value === 'PENDING_UPLOAD' ? 'pending' : value === 'REPLACED' ? 'replaced' : /ERROR|REJECT|ISSUE|FAILED/.test(value) ? 'error' : 'draft';
    return '<span class="badge registrationStatus ' + tone + '">' + esc(value) + '</span>';
  }

  function registrationDetailSection(title, fields, tone) {
    return '<section class="section registrationDetailCard ' + esc(tone || '') + '"><div class="sectionHead"><h2>' + esc(title) + '</h2></div><div class="sectionBody"><dl class="drawerGrid">' +
      fields.map(function (field) { return '<dt>' + esc(field[0]) + '</dt><dd>' + esc(valueOf(field[1], '—')) + '</dd>'; }).join('') +
      '</dl></div></section>';
  }

  async function openRegistrationV2Document(doc, button) {
    const popup = window.open('', '_blank');
    if (!popup) { alert('Browser บล็อกหน้าต่างใหม่'); return; }
    popup.document.write('<meta charset="utf-8"><title>กำลังเปิดเอกสาร</title><p style="font:16px sans-serif;padding:24px">กำลังขอสิทธิ์เปิดเอกสาร...</p>');
    popup.document.close();
    const old = button.textContent;
    try {
      button.disabled = true;
      button.textContent = 'กำลังเปิด...';
      const result = await call('documentGetViewUrl', { documentId: doc.documentId });
      if (!/^https:\/\//.test(String(result.url || ''))) throw new Error('ไม่ได้รับ signed URL');
      popup.location.replace(result.url);
    } catch (error) {
      try { popup.document.body.textContent = I18N.errorText(error); } catch (_) {}
      throw error;
    } finally {
      button.disabled = false;
      button.textContent = old;
    }
  }

  async function renderRegistrationV2Detail(registrationId) {
    const target = document.getElementById('registrationDetail');
    if (!target) return;
    const requestId = ++registrationDetailSequence;
    target.innerHTML = '<section class="section"><div class="skeleton skeletonLine"></div><div class="skeleton skeletonLine"></div></section>';
    try {
      const result = await call('adminGetRegistrationV2', { registrationId: registrationId });
      if (requestId !== registrationDetailSequence || registrationId !== selectedRegistrationId) return;
      const row = result.registration || {}, documents = rowsOf({ rows: result.documents });
      const types = [
        { type:'ID_CARD', label:'บัตรประชาชน', required:true },
        { type:'HOUSE_REGISTRATION', label:'ทะเบียนบ้าน', required:true },
        { type:'EDUCATION', label:'วุฒิการศึกษา', required:false },
        { type:'OTHER', label:'เอกสารอื่น', required:false },
        { type:'EMPLOYEE_PHOTO', label:'รูปถ่ายพนักงาน', required:true }
      ];
      const documentGroups = groupRegistrationDocuments(documents, types), documentRows = [];
      documentGroups.forEach(function (group) {
        const spec = group.spec, doc = group.current;
        if (!doc) {

        }).join('') + '</tbody></table></div>' : '<div class="empty">ยังไม่มีรายการลงทะเบียน</div>') + '</section><div id="registrationDetail"></div>';
      bindRegistrationShare();

    document.getElementById('dashboardRefresh').onclick = function () { dashboardCache = null; renderDashboard(false); };

    function sectionError(id, retry) {
      const node = document.getElementById(id);
      if (!node) return;
      node.innerHTML = '<div class="sectionError"><strong>' + esc(t('dashboard.sectionUnavailable')) + '</strong><button class="btn small" type="button">' + esc(t('common.retry')) + '</button></div>';
      node.querySelector('button').onclick = retry;
    }

    function renderActions() {
      const items = [];
      if (state.attendance) {
        const missing = Number(state.attendance.notCheckedIn || 0) + Number(state.attendance.absent || 0);
        const noCheckout = Number(state.attendance.noCheckOut || 0);
        if (missing) items.push([t('metric.notArrived'), missing, 'attendance', 'REVIEW']);
        if (noCheckout) items.push([t('metric.noCheckout'), noCheckout, 'attendance', 'REVIEW']);
      }
      if (state.queue && state.queue.length) items.push([t('view.review'), state.queue.length, 'work-queue', 'PENDING']);
      if (state.payroll) {
        const count = state.payroll.filter(function (row) { return /REVIEW|HOLD|DISPUTE|EMPLOYEE_REVIEW/i.test(row.status || row.Status || ''); }).length;
        if (count) items.push([t('metric.payrollReview'), count, 'payroll-period', 'REVIEW']);
      }
      if (state.notifications) {
        const unread = Number(state.notifications.unread || 0);
        if (unread) items.push([t('dashboard.importantAlerts'), unread, 'notifications', 'UNREAD']);
      }
      const box = document.getElementById('dashboardActions');
      if (!box) return;
      if (!items.length && [state.attendance, state.queue, state.payroll, state.notifications].some(Boolean)) {
        box.innerHTML = '<div class="empty compact">' + esc(t('dashboard.noAction')) + '</div>';
        return;
      }
      if (!items.length) return;
      box.innerHTML = items.map(function (item) {

        return '<div class="actionRow"><div><strong>' + esc(item[0]) + '</strong><div class="metricMeta">' + esc(t('common.attention')) + '</div></div><span class="actionCount">' + esc(item[1]) + '</span>' + badge(item[3]) + '<a class="btn small" href="' + url + '">' + esc(t('dashboard.openModule')) + '</a></div>';
      }).join('');
    }

    function renderMetrics(workforce) {
      const attendance = state.attendance || {};
      const queue = state.queue || [];
      const payroll = state.payroll || [];
      const notifications = state.notifications || {};
      const payrollReview = payroll.filter(function (row) { return /REVIEW|HOLD|DISPUTE|EMPLOYEE_REVIEW/i.test(row.status || row.Status || ''); }).length;
      document.getElementById('dashboardMetrics').innerHTML =
        metric('common.total', workforce.total, t('view.employees')) +
        metric('metric.scheduledToday', attendance.expected, t('view.schedule')) +
        metric('metric.arrived', attendance.present, t('status.active')) +
        metric('metric.notArrived', Number(attendance.notCheckedIn || 0) + Number(attendance.absent || 0), t('common.attention')) +
        metric('metric.late', attendance.late, t('view.attendance')) +
        metric('metric.onLeave', attendance.leave, t('view.leave')) +
        metric('metric.noCheckout', attendance.noCheckOut, t('common.attention')) +
        metric('metric.pendingItems', queue.length, t('view.review')) +
        metric('metric.payrollReview', payrollReview, t('view.payrollReview')) +
        metric('metric.unread', notifications.unread, t('view.notifications'));

    function renderAttendanceSection(summary) {
      const box = document.getElementById('dashboardAttendance');
      box.innerHTML = '<div class="miniStats">' +
        '<div><span>' + esc(t('metric.scheduledToday')) + '</span><strong>' + esc(valueOf(summary.expected, 0)) + '</strong></div>' +
        '<div><span>' + esc(t('metric.arrived')) + '</span><strong>' + esc(valueOf(summary.present, 0)) + '</strong></div>' +
        '<div><span>' + esc(t('metric.late')) + '</span><strong>' + esc(valueOf(summary.late, 0)) + '</strong></div>' +
        '<div><span>' + esc(t('metric.onLeave')) + '</span><strong>' + esc(valueOf(summary.leave, 0)) + '</strong></div>' +
        '</div>';

    function renderQueueSection(rows) {
      const box = document.getElementById('dashboardQueue');
      if (!rows.length) { box.innerHTML = '<div class="empty compact">' + esc(t('common.noData')) + '</div>'; return; }
      box.innerHTML = '<div class="tableWrap"><table><thead><tr><th>' + esc(t('table.item')) + '</th><th>' + esc(t('table.branch')) + '</th><th>' + esc(t('table.date')) + '</th><th>' + esc(t('table.status')) + '</th></tr></thead><tbody>' + rows.slice(0, 8).map(function (row) {

      }).join('') + '</tbody></table></div>';

      }).join('') + '</div>';
    }

    let workforce = reuseCache && dashboardCache ? dashboardCache.workforce : {};
    if (reuseCache && dashboardCache) {
      renderMetrics(workforce);
      if (state.attendance) renderAttendanceSection(state.attendance);
      if (state.queue) renderQueueSection(state.queue);
      if (state.notifications) renderNotificationSection(state.notifications);
      renderActions();
      return;
    }
    const loadWorkforce = function () { return call('adminSearchEmployees', { query: '', limit: 1 }).then(function (result) { workforce = { total: Number(result.total || rowsOf(result).length) }; renderMetrics(workforce); }).catch(function () { renderMetrics(workforce); }); };
    const loadAttendance = function () { return call('adminAttendanceControl', { date: today, branchCode: '', departmentCode: '', employeeQuery: '', status: '' }).then(function (result) { state.attendance = result.summary || {}; renderAttendanceSection(state.attendance); renderMetrics(workforce); renderActions(); }).catch(function () { sectionError('dashboardAttendance', loadAttendance); }); };
    const loadQueue = function () { return call('adminGetWorkQueue', { status: 'OPEN', limit: 8 }).then(function (result) { state.queue = rowsOf(result); renderQueueSection(state.queue); renderMetrics(workforce); renderActions(); }).catch(function () { sectionError('dashboardQueue', loadQueue); }); };
    const loadNotifications = function () { return call('adminGetNotificationCenter').then(function (result) { state.notifications = result; renderNotificationSection(result); renderMetrics(workforce); renderActions(); }).catch(function () { sectionError('dashboardNotifications', loadNotifications); }); };
    const loadPayroll = function () { return call('adminGetPayrollPeriods').then(function (result) { state.payroll = rowsOf(result); renderMetrics(workforce); renderActions(); }).catch(function () { state.payroll = []; renderMetrics(workforce); renderActions(); }); };
    await Promise.allSettled([loadWorkforce(), loadAttendance(), loadQueue(), loadNotifications(), loadPayroll()]);
    dashboardCache = { workforce: workforce, attendance: state.attendance, queue: state.queue, notifications: state.notifications, payroll: state.payroll };
  }

        const result = await call('adminAttendanceControl', {
          date: document.getElementById('attendanceDate').value,
          branchCode: document.getElementById('attendanceBranch').value,
          departmentCode: document.getElementById('attendanceDepartment').value,
          employeeQuery: document.getElementById('attendanceSearch').value,
          status: ''
        });
        if (ownRequest !== renderSequence) return;
        const summary = result.summary || {};
        const rows = rowsOf(result);
        summaryBox.className = 'grid';
        summaryBox.innerHTML = metric('common.total', summary.expected, t('view.attendance')) +
          metric('metric.todayAttendance', summary.present, t('status.active')) +
          metric('common.attention', Number(summary.absent || 0) + Number(summary.noCheckOut || 0), t('view.review')) +
          metric('common.pending', summary.notCheckedIn, t('view.attendance'));
        detailBox.innerHTML = rows.length ? '<div class="tableWrap"><table><thead><tr><th>' + esc(t('table.employee')) + '</th><th>' + esc(t('table.branch')) + '</th><th>' + esc(t('table.time')) + '</th><th>' + esc(t('table.status')) + '</th><th>' + esc(t('table.action')) + '</th></tr></thead><tbody>' +
          rows.map(function (row, index) { return '<tr><td><strong>' + esc(row.employeeName) + '</strong><div class="metricMeta">' + esc(row.employeeId) + ' · ' + esc(row.nickname) + '</div></td><td>' + esc(row.branchCode) + '<div class="metricMeta">' + esc(row.departmentCode) + '</div></td><td>' + esc(valueOf(row.checkIn, '—')) + ' – ' + esc(valueOf(row.checkOut, '—')) + '</td><td>' + badge(row.status) + '</td><td><button class="btn small" type="button" data-row-index="' + index + '">' + esc(t('common.viewDetail')) + '</button></td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">' + esc(t('common.noData')) + '</div>';
        bindRowDetails(detailBox, rows, [['table.employee', 'employeeName'], ['table.branch', 'branchCode'], ['table.department', 'departmentCode'], ['table.status', 'status']]);
      } catch (error) {
        if (ownRequest !== renderSequence) return;
        detailBox.innerHTML = '<div class="error"><strong>' + esc(t('common.error')) + '</strong><div>' + esc(I18N.errorText(error)) + '</div><button class="btn" id="attendanceRetry" type="button">' + esc(t('common.retry')) + '</button></div>';
        document.getElementById('attendanceRetry').onclick = load;
      }
    }

    document.getElementById('attendanceLoad').onclick = load;
    document.getElementById('attendanceDate').onchange = load;
    document.getElementById('attendanceBranch').onchange = load;
    document.getElementById('attendanceDepartment').onchange = load;
    let timer;
    document.getElementById('attendanceSearch').oninput = function () { clearTimeout(timer); timer = setTimeout(load, 350); };
    if (requestId <= renderSequence) await load();
  }

  async function renderPayrollPeriods() {
    loading();
    try {
      const result = await call('adminGetPayrollPeriods');
      const rows = rowsOf(result);
      const total = rows.reduce(function (sum, row) { return sum + Number(row['Total Amount'] || 0); }, 0);
      app.innerHTML = flowLabel('summary.title') + '<div class="grid">' +
        metric('metric.periods', rows.length, t('common.readOnly')) + metric('table.amount', formatNumber(total), t('view.payrollPeriod')) +
        metric('common.completed', rows.filter(function (row) { return /PAID|CLOSED|COMPLETED/i.test(row.Status || ''); }).length, t('common.total')) +
        metric('common.pending', rows.filter(function (row) { return !/PAID|CLOSED|COMPLETED/i.test(row.Status || ''); }).length, t('common.total')) + '</div>' +
        flowLabel('action.title') + '<section class="section"><div class="toolbar"><button class="btn" id="payrollRefresh" type="button">' + esc(t('common.refresh')) + '</button><span class="metricMeta">' + esc(t('preview.noWrite')) + '</span></div></section>' +
        flowLabel('detail.title') + section('view.payrollPeriod', rows.length ? '<div class="tableWrap"><table><thead><tr><th>' + esc(t('table.period')) + '</th><th>' + esc(t('table.date')) + '</th><th>' + esc(t('table.employee')) + '</th><th>' + esc(t('table.amount')) + '</th><th>' + esc(t('table.status')) + '</th><th>' + esc(t('table.action')) + '</th></tr></thead><tbody>' +
        rows.map(function (row, index) { return '<tr><td><strong>' + esc(row['Period ID']) + '</strong></td><td>' + esc(row['Start Date']) + ' – ' + esc(row['End Date']) + '</td><td>' + esc(row['Employee Count']) + '</td><td>' + esc(formatNumber(row['Total Amount'])) + '</td><td>' + badge(row.Status) + '</td><td><button class="btn small" type="button" data-row-index="' + index + '">' + esc(t('common.viewDetail')) + '</button></td></tr>'; }).join('') + '</tbody></table></div>' : '<div class="empty">' + esc(t('common.noData')) + '</div>');
      bindRowDetails(app, rows, [['table.period', 'Period ID'], ['table.date', 'Pay Date'], ['table.amount', 'Total Amount'], ['table.status', 'Status']]);
      document.getElementById('payrollRefresh').onclick = renderPayrollPeriods;
    } catch (error) { showError(error, renderPayrollPeriods); }
  }

  function shouldPreview() {
    if (ALWAYS_PREVIEW.has(view)) return true;
    const flag = PREVIEW_RULES[view];
    return Boolean(flag && !(bootstrap.flags || {})[flag]);
  }

  async function renderCurrentView() {
    updateHeading();
    if (shouldPreview()) return previewView();
    if (view === 'dashboard') return renderDashboard();
    if (view === 'work-queue') return renderQueue();
    if (view === 'notifications') return renderNotifications();
    if (view === 'registrations' || view === 'employee-documents') return renderRegistrationsV2();
    if (view === 'attendance') return renderAttendance();
    if (view === 'payroll-period') return renderPayrollPeriods();
    return previewView();
  }

  async function start() {
    updateHeading();
    I18N.bindLanguageSwitchers(document);
    if (!backendReady || !api) {
      app.innerHTML = '<div class="error"><strong>' + esc(t('error.invalidUrl')) + '</strong></div>';
      return;
    }
    token = getToken();
    if (!token && parent !== window) {
      parent.postMessage({ type: 'KruaFlowAdminSessionRequest' }, location.origin);
      await new Promise(function (resolve) { setTimeout(resolve, 350); });
      token = getToken();
    }
    if (!token) {
      app.innerHTML = '<div class="error"><strong>' + esc(t('auth.missingSession')) + '</strong><div><a class="btn" href="./workspace.html' + (isStaging ? '?staging=1' : '') + '">' + esc(t('app.name')) + '</a></div></div>';
      return;
    }
    loading();
    try {
      bootstrap = await call('workforceBootstrap');
      if (!bootstrap.ready) { app.innerHTML = '<div class="notice"><strong>' + esc(t('schema.notReady')) + '</strong></div>'; return; }
      if (!(bootstrap.flags || {}).WORKFORCE_V2_ENABLED) { app.innerHTML = '<div class="notice"><strong>' + esc(t('schema.disabled')) + '</strong></div>'; return; }
      await renderCurrentView();
    } catch (error) { showError(error, start); }
  }

  document.getElementById('drawerClose').onclick = function () { document.getElementById('drawerBackdrop').hidden = true; };
  document.getElementById('drawerBackdrop').onclick = function (event) { if (event.target === event.currentTarget) event.currentTarget.hidden = true; };
  document.addEventListener('keydown', function (event) { if (event.key === 'Escape') document.getElementById('drawerBackdrop').hidden = true; });
  window.addEventListener('message', function (event) {
    if (event.origin !== location.origin || !event.data) return;
    if (event.data.type === 'KruaFlowAdminSession' && event.data.token) SESSION.save(event.data.token, event.data.expiresIn);
    if (event.data.type === 'KruaFlowLanguage' && event.data.language !== I18N.getLanguage()) I18N.setLanguage(event.data.language);
  });
  window.addEventListener('KruaFlowLanguageChange', function () {
    updateHeading();
    if (parent !== window) parent.postMessage({ type: 'KruaFlowLanguageChange', language: I18N.getLanguage() }, location.origin);
    if (bootstrap) {
      if (view === 'dashboard' && dashboardCache) renderDashboard(true);
      else renderCurrentView();
    }
  });
  start();
})();
</script>
</body>
</html>

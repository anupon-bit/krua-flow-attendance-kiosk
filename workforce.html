<!doctype html>
<html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow"><title>KruaFlow Workforce</title><script src="./config.js"></script><script src="./mock-data.js"></script><script src="./js/api-client.js"></script><link rel="stylesheet" href="./css/workforce.css"></head>
<body><main class="page"><header class="head"><div><h1 id="title">Workforce</h1><div class="sub" id="subtitle">ข้อมูลจริงจากระบบ • รายละเอียดโหลดเมื่อเปิดหน้า</div></div><div class="spacer"></div><span class="env" id="env">PRODUCTION</span></header><div id="app" class="loading">กำลังโหลด...</div></main>
<script>
(function(){'use strict';
const q=new URLSearchParams(location.search),view=q.get('view')||'dashboard',isStaging=q.get('staging')==='1',SS='kruaFlowAdminTokenV4',LS='kruaFlowAdminTokenPersistentV1',EXP='kruaFlowAdminTokenPersistentExpV1',app=document.getElementById('app'),api=new KruaFlowApi.Client();let token='',bootstrap=null;
const titles={dashboard:'ภาพรวมระบบ',applicants:'ผู้สมัครงาน',interviews:'นัดสัมภาษณ์',staffing:'แผนรับพนักงาน',onboarding:'Onboarding',offboarding:'Offboarding','work-queue':'งานรอตรวจ',notifications:'แจ้งเตือน',activity:'Daily Activity',attendance:'เวลาเข้าออก','shift-check':'Daily Shift Check','payroll-period':'รอบค่าแรง',reports:'รายงาน Workforce',performance:'Performance',retention:'Retention'};
document.getElementById('title').textContent=titles[view]||'Workforce';document.getElementById('env').textContent=isStaging?'STAGING':'PRODUCTION';document.getElementById('env').classList.toggle('staging',isStaging);
function esc(v){return String(v==null?'':v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'})[c])}function pct(v){return v==null?'N/A':Number(v).toLocaleString('th-TH',{maximumFractionDigits:1})+'%'}function badge(v){const s=String(v||''),good=/ACTIVE|HIRED|ACCEPTED|PASSED|DONE|VERIFIED/.test(s),bad=/REJECTED|DECLINED|CANCELLED|NO_SHOW|ISSUE/.test(s);return'<span class="badge '+(good?'good':bad?'bad':'warn')+'">'+esc(s||'-')+'</span>'}function metric(label,value,meta){return'<div class="card"><div class="metricLabel">'+esc(label)+'</div><div class="metric">'+esc(value)+'</div><div class="metricMeta">'+esc(meta||'')+'</div></div>'}
function getToken(){let t=sessionStorage.getItem(SS)||'';if(t)return t;const p=localStorage.getItem(LS)||'',e=Number(localStorage.getItem(EXP)||0);return p&&e>Date.now()?p:''}function error(e){app.className='error';app.textContent=e&&e.message?e.message:String(e)}function call(op,data){return api.call(Object.assign({op:op,adminToken:token},data||{}))}
async function renderDashboard(){app.className='loading';app.textContent='กำลังสรุปข้อมูล...';const d=await call('adminWorkforceDashboard');app.className='';app.innerHTML='<div class="grid">'+metric('พนักงานทั้งหมด',d.workforce.total,'Employees')+metric('Active',d.workforce.active,'ไม่รวม Probation')+metric('Probation',d.workforce.probation,'Employment Status')+metric('งานรอตรวจ',d.workQueue.open,'Urgent '+d.workQueue.urgent)+metric('ผู้สมัคร',d.recruitment.applicants,'Applicants')+metric('นัดสัมภาษณ์',d.recruitment.interviews,'Applicant_Interviews')+metric('Interview Show Rate',pct(d.recruitment.interviewShowRate),'attended / scheduled')+metric('Offer Acceptance',pct(d.recruitment.offerAcceptanceRate),'accepted / sent')+'</div><section class="section"><h2>Recruitment Funnel</h2><div class="grid">'+metric('Screening',d.recruitment.screening,'สถานะปัจจุบัน')+metric('Passed',d.recruitment.passed,'ผ่านสัมภาษณ์')+metric('Hired / Pre-onboarding',d.recruitment.hired,'เชื่อม Person เดิม')+metric('Hire Conversion',pct(d.recruitment.hireConversionRate),'hired / submitted')+'</div></section>'}
async function renderApplicants(){app.className='';app.innerHTML='<div class="toolbar"><label class="sr" for="search">ค้นหา</label><input class="input" id="search" placeholder="ค้นหา ID ชื่อ ชื่อเล่น หรือโทรศัพท์"><select class="select" id="status"><option value="">ทุกสถานะ</option><option>SUBMITTED</option><option>SCREENING</option><option>INTERVIEW_SCHEDULED</option><option>INTERVIEW_ATTENDED</option><option>PASSED</option><option>OFFER_SENT</option><option>OFFER_ACCEPTED</option><option>PRE_ONBOARDING</option><option>REJECTED</option></select><button class="btn" id="refresh">รีเฟรช</button><a class="btn primary" href="./apply.html'+(isStaging?'?staging=1':'')+'" target="_blank" rel="noopener" style="text-decoration:none;display:grid;place-items:center">เปิดใบสมัครสาธารณะ</a></div><div id="rows" class="loading">กำลังโหลด...</div>';const load=async()=>{const r=await call('adminRecruitmentList',{query:document.getElementById('search').value,status:document.getElementById('status').value,limit:100}),box=document.getElementById('rows');if(!r.rows.length){box.className='empty';box.textContent='ไม่พบผู้สมัคร';return}box.className='tableWrap';box.innerHTML='<table><thead><tr><th>ผู้สมัคร</th><th>ตำแหน่ง / สาขา</th><th>Source</th><th>สถานะ</th><th>ส่งเมื่อ</th><th>Action</th></tr></thead><tbody>'+r.rows.map(x=>'<tr><td><b>'+esc(x.name)+'</b><br><span class="metricMeta">'+esc(x.applicantId)+' • '+esc(x.phone)+(x.duplicateReviewRequired?' • ต้องตรวจบุคคลซ้ำ':'')+'</span></td><td>'+esc(x.positionCode)+'<br><span class="metricMeta">'+esc(x.branchCode)+'</span></td><td>'+esc(x.source)+'</td><td>'+badge(x.status)+'</td><td>'+esc(x.submittedAt)+'</td><td><div class="actions">'+actions(x)+'</div></td></tr>').join('')+'</tbody></table>';box.querySelectorAll('[data-next]').forEach(b=>b.onclick=async()=>{b.disabled=true;try{await call('adminTransitionApplicant',{applicantId:b.dataset.id,status:b.dataset.next});await load()}catch(e){alert(e.message||e)}finally{b.disabled=false}})};function actions(x){const m={SUBMITTED:[['SCREENING','เริ่มคัดกรอง'],['REJECTED','ปฏิเสธ']],SCREENING:[['REJECTED','ปฏิเสธ']],INTERVIEW_ATTENDED:[['PASSED','ผ่าน'],['REJECTED','ไม่ผ่าน']]},list=m[x.status]||[];return list.map(a=>'<button class="btn small" data-id="'+esc(x.applicantId)+'" data-next="'+a[0]+'">'+a[1]+'</button>').join('')||'<span class="metricMeta">ใช้ขั้นตอน Interview / Offer ที่เชื่อม record จริง</span>'}document.getElementById('refresh').onclick=load;document.getElementById('status').onchange=load;let timer;document.getElementById('search').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,300)};await load()}
async function renderQueue(){const r=await call('adminGetWorkQueue',{status:'OPEN',limit:100});if(!r.rows.length){app.className='empty';app.textContent='ไม่มีงานรอตรวจ';return}app.className='tableWrap';app.innerHTML='<table><thead><tr><th>ลำดับ</th><th>งาน</th><th>อ้างอิง</th><th>พื้นที่</th><th>ครบกำหนด</th><th>สถานะ</th></tr></thead><tbody>'+r.rows.map(x=>'<tr><td>'+badge(x.priority)+'</td><td><b>'+esc(x.title)+'</b></td><td>'+esc(x.entityType)+' • '+esc(x.entityId)+'</td><td>'+esc(x.branchCode||'-')+' / '+esc(x.departmentCode||'-')+'</td><td>'+esc(x.dueAt||'-')+'</td><td>'+badge(x.status)+'</td></tr>').join('')+'</tbody></table>'}
async function renderStaffing(){const r=await call('adminGetStaffingTargets');if(!r.rows.length){app.className='empty';app.innerHTML='<b>ยังไม่มี Staffing Target</b><div class="formula">เพิ่มเป้าหมายผ่าน API adminSaveStaffingTarget หลังยืนยัน Branch / Department / Position master</div>';return}app.className='tableWrap';app.innerHTML='<table><thead><tr><th>สาขา</th><th>แผนก</th><th>ตำแหน่ง</th><th>Target</th><th>Active</th><th>Probation</th><th>Gap</th><th>Pipeline</th></tr></thead><tbody>'+r.rows.map(x=>'<tr><td>'+esc(x.branchCode)+'</td><td>'+esc(x.departmentCode)+'</td><td><b>'+esc(x.positionCode)+'</b></td><td>'+x.targetHeadcount+'</td><td>'+x.activeHeadcount+'</td><td>'+x.probationHeadcount+'</td><td>'+badge(String(x.gap))+'</td><td>'+x.pipelineCount+'</td></tr>').join('')+'</tbody></table>'}
async function renderActivity(){if(!bootstrap.flags.ACTIVITY_ENABLED){renderUnavailable();return}const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10),end=now.toISOString().slice(0,10),r=await call('adminActivityDashboard',{startDate:start,endDate:end});app.className='';app.innerHTML='<div class="grid">'+metric('Required Reporters',r.requiredReporters,'Activity_Reports')+metric('Submitted',r.submitted,'Submission '+pct(r.submissionRate))+metric('Assigned Tasks',r.assignedTasks,'Activity_Items')+metric('Completed',r.completed,'Completion '+pct(r.completionRate))+metric('Pending',r.pending,'ยังไม่ DONE/ISSUE')+metric('Issues',r.issues,'เชื่อม Work Queue')+metric('On-time',pct(r.onTimeCompletionRate),'DONE by dueAt / DONE')+'</div><section class="section"><div class="notice">ช่วง '+start+' ถึง '+end+' • ตัวเลขมาจาก Activity_Reports และ Activity_Items เท่านั้น</div></section>'}
async function renderAttendance(){const today=new Date().toISOString().slice(0,10);app.className='';app.innerHTML='<div class="toolbar"><input class="input" id="attDate" type="date" value="'+today+'"><select class="select" id="attBranch"><option value="">ทุกสาขา</option>'+bootstrap.branches.map(x=>'<option value="'+esc(x.code)+'">'+esc(x.name)+'</option>').join('')+'</select><select class="select" id="attDept"><option value="">ทุกแผนก</option>'+bootstrap.departments.map(x=>'<option value="'+esc(x.code)+'">'+esc(x.name)+'</option>').join('')+'</select><input class="input" id="attEmployee" placeholder="ค้นหารหัส ชื่อ ชื่อเล่น"><select class="select" id="attStatus"><option value="">ทุกสถานะ</option><option>NORMAL</option><option>NOT_CHECKED_IN</option><option>ABSENT</option><option>LATE</option><option>NO_CHECK_OUT</option><option>LEAVE</option><option>UNPLANNED</option></select><button class="btn" id="attLoad">ดูข้อมูล</button></div><div id="attBody" class="loading">กำลังโหลด...</div>';const load=async()=>{const body=document.getElementById('attBody');body.className='loading';body.textContent='กำลังโหลด...';const r=await call('adminAttendanceControl',{date:document.getElementById('attDate').value,branchCode:document.getElementById('attBranch').value,departmentCode:document.getElementById('attDept').value,employeeQuery:document.getElementById('attEmployee').value,status:document.getElementById('attStatus').value});body.className='';body.innerHTML='<div class="grid">'+metric('Expected',r.summary.expected,'Schedule')+metric('Present',r.summary.present,'Attendance IN')+metric('Not Checked In',r.summary.notCheckedIn,'ยังไม่ถึงจบกะ')+metric('Leave',r.summary.leave,'Approved Leave')+metric('Absent',r.summary.absent,'เลยเวลาจบกะ')+metric('Late',r.summary.late,'เกิน grace')+metric('No Check Out',r.summary.noCheckOut,'ต้องตรวจสอบ')+metric('Unplanned',r.summary.unplanned,'มีเวลาแต่ไม่มี Schedule')+metric('OT',r.summary.ot+' ชม.','เทียบ Standard Hours')+'</div><section class="section"><div class="tableWrap"><table><thead><tr><th>พนักงาน</th><th>สาขา / แผนก</th><th>กะ</th><th>เข้า</th><th>ออก</th><th>ชั่วโมง</th><th>สาย</th><th>OT</th><th>สถานะ</th></tr></thead><tbody>'+r.rows.map(x=>'<tr><td><b>'+esc(x.employeeName)+'</b><br><span class="metricMeta">'+esc(x.employeeId)+' • '+esc(x.nickname)+'</span></td><td>'+esc(x.branchCode)+' / '+esc(x.departmentCode)+'</td><td>'+esc(x.shiftCode)+'<br><span class="metricMeta">'+esc(x.scheduledShift)+'</span></td><td>'+esc(x.checkIn||'-')+'</td><td>'+esc(x.checkOut||'-')+'</td><td>'+x.workedHours+'</td><td>'+x.lateMinutes+' นาที</td><td>'+x.otHours+'</td><td>'+badge(x.status)+'</td></tr>').join('')+'</tbody></table></div></section>'};document.getElementById('attLoad').onclick=load;let timer;document.getElementById('attEmployee').oninput=()=>{clearTimeout(timer);timer=setTimeout(load,350)};await load()}
async function renderReports(kind){const now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10),end=now.toISOString().slice(0,10);if(kind==='retention'){if(!bootstrap.flags.OFFBOARDING_ENABLED){renderUnavailable();return}const r=await call('adminRetentionReport',{startDate:start,endDate:end});app.className='';app.innerHTML='<div class="grid">'+metric('Turnover',pct(r.metrics.turnoverRate),r.formulas.turnoverRate)+metric('Voluntary',r.metrics.voluntary,'Employee_Exits')+metric('Involuntary',r.metrics.involuntary,'Employee_Exits')+metric('Average Tenure',r.metrics.averageTenureDays==null?'N/A':r.metrics.averageTenureDays+' วัน',r.formulas.averageTenureDays)+metric('30-day Retention',pct(r.metrics.retention30.rate),r.metrics.retention30.retained+'/'+r.metrics.retention30.eligible)+metric('60-day Retention',pct(r.metrics.retention60.rate),r.metrics.retention60.retained+'/'+r.metrics.retention60.eligible)+metric('90-day Retention',pct(r.metrics.retention90.rate),r.metrics.retention90.retained+'/'+r.metrics.retention90.eligible)+'</div>';return}const r=await call('adminRecruitmentReport',{startDate:start,endDate:end});app.className='';app.innerHTML='<div class="grid">'+metric('Applications',r.metrics.applications,'Applicants')+metric('Interviews',r.metrics.interviewsScheduled,'Applicant_Interviews')+metric('Show Rate',pct(r.metrics.interviewShowRate),r.formulas.interviewShowRate)+metric('Passed',r.metrics.passed,'Applicant status')+metric('Offers Sent',r.metrics.offersSent,'Offers')+metric('Offer Acceptance',pct(r.metrics.offerAcceptanceRate),r.formulas.offerAcceptanceRate)+metric('Hired',r.metrics.hired,'Applicants')+metric('Hire Conversion',pct(r.metrics.hireConversionRate),r.formulas.hireConversionRate)+'</div><section class="section"><h2>Source Conversion</h2><div class="tableWrap"><table><thead><tr><th>Source</th><th>Applications</th><th>Hired</th><th>Conversion</th></tr></thead><tbody>'+r.bySource.map(x=>'<tr><td>'+esc(x.source)+'</td><td>'+x.applications+'</td><td>'+x.hired+'</td><td>'+pct(x.conversionRate)+'</td></tr>').join('')+'</tbody></table></div></section>'}
async function renderPayrollPeriods(){const r=await call('adminGetPayrollPeriods');if(!r.rows.length){app.className='empty';app.innerHTML='<b>ยังไม่มี Payroll Period</b><div class="formula">สร้างผ่าน adminSavePayrollPeriod โดยไม่กระทบสูตรหรือ Payroll history เดิม</div>';return}app.className='tableWrap';app.innerHTML='<table><thead><tr><th>Period</th><th>ช่วงวันที่</th><th>Pay Date</th><th>ประเภท</th><th>พนักงาน</th><th>ยอดรวม</th><th>สถานะ</th></tr></thead><tbody>'+r.rows.map(x=>'<tr><td><b>'+esc(x['Period ID'])+'</b></td><td>'+esc(x['Start Date'])+' – '+esc(x['End Date'])+'</td><td>'+esc(x['Pay Date'])+'</td><td>'+esc(x['Period Type'])+'</td><td>'+esc(x['Employee Count'])+'</td><td>'+Number(x['Total Amount']||0).toLocaleString('th-TH')+'</td><td>'+badge(x['Status'])+'</td></tr>').join('')+'</tbody></table>'}
async function renderNotifications(){const r=await call('adminGetNotificationCenter');if(!r.rows.length){app.className='empty';app.textContent='ไม่มีการแจ้งเตือนสำหรับ Admin';return}app.className='';app.innerHTML='<div class="notice">ยังไม่อ่าน '+r.unread+' รายการ • Notification เป็นสิ่งที่ควรรู้ ไม่ใช่งานรอตรวจ</div><section class="section"><div class="tableWrap"><table><thead><tr><th>เวลา</th><th>เรื่อง</th><th>อ้างอิง</th><th>สถานะ</th><th></th></tr></thead><tbody>'+r.rows.map(x=>'<tr><td>'+esc(x.createdAt)+'</td><td><b>'+esc(x.title)+'</b><br><span class="metricMeta">'+esc(x.message)+'</span></td><td>'+esc(x.entityType)+' '+esc(x.entityId)+'</td><td>'+badge(x.status)+'</td><td>'+(x.status==='UNREAD'?'<button class="btn small" data-read="'+esc(x.notificationId)+'">อ่านแล้ว</button>':'')+'</td></tr>').join('')+'</tbody></table></div></section>';app.querySelectorAll('[data-read]').forEach(b=>b.onclick=async()=>{await call('adminMarkNotificationRead',{notificationId:b.dataset.read});await renderNotifications()})}
async function renderExits(){if(!bootstrap.flags.OFFBOARDING_ENABLED){renderUnavailable();return}const r=await call('adminGetEmployeeExits');if(!r.rows.length){app.className='empty';app.textContent='ไม่มี Offboarding workflow';return}app.className='tableWrap';app.innerHTML='<table><thead><tr><th>พนักงาน</th><th>ประเภท</th><th>วันสุดท้าย</th><th>Checklist</th><th>Rehire</th><th>สถานะ</th></tr></thead><tbody>'+r.rows.map(x=>'<tr><td>'+esc(x['Employee ID'])+'</td><td>'+esc(x['Exit Type'])+'<br><span class="metricMeta">'+esc(x['Reason Category'])+'</span></td><td>'+esc(x['Last Working Date'])+'</td><td>'+x.checklistDone+' / '+x.checklistTotal+'</td><td>'+esc(x['Rehire Eligible'])+'</td><td>'+badge(x['Status'])+'</td></tr>').join('')+'</tbody></table>'}
async function renderPerformance(){if(!bootstrap.flags.PERFORMANCE_ENABLED){renderUnavailable();return}const employees=await call('adminSearchEmployees',{limit:100}),now=new Date(),start=new Date(now.getFullYear(),now.getMonth(),1).toISOString().slice(0,10),end=now.toISOString().slice(0,10);app.className='';app.innerHTML='<div class="toolbar"><input class="input" id="perfEmployee" list="employeeOptions" placeholder="ค้นหารหัส/ชื่อ แล้วเลือกรหัส"><datalist id="employeeOptions">'+employees.rows.map(e=>'<option value="'+esc(e.employeeId)+'">'+esc(e.name)+' • '+esc(e.nickname)+'</option>').join('')+'</datalist><input class="input" id="perfStart" type="date" value="'+start+'"><input class="input" id="perfEnd" type="date" value="'+end+'"><button class="btn primary" id="perfRun">คำนวณ Raw KPI</button></div><div id="perfBody" class="notice">เลือกพนักงานและช่วงเวลา • ระบบจะไม่สร้างคะแนนรวมถ้า config ไม่ครบ</div>';document.getElementById('perfRun').onclick=async()=>{const body=document.getElementById('perfBody');body.className='loading';body.textContent='กำลังคำนวณ...';try{const r=await call('adminCalculateEmployeePerformance',{employeeId:document.getElementById('perfEmployee').value.trim().toUpperCase(),startDate:document.getElementById('perfStart').value,endDate:document.getElementById('perfEnd').value});body.className='';body.innerHTML=(r.configError?'<div class="notice">'+esc(r.configError)+'</div>':'<div class="card"><div class="metricLabel">Performance Score</div><div class="metric">'+(r.totalScore==null?'N/A':r.totalScore)+'</div><div class="metricMeta">Weight '+r.weightTotal+'%</div></div>')+'<section class="section"><div class="tableWrap"><table><thead><tr><th>KPI</th><th>Raw</th><th>Numerator</th><th>Denominator</th><th>Target</th><th>Weight</th><th>Source / Formula</th><th>Quality</th></tr></thead><tbody>'+r.rawMetrics.map(x=>'<tr><td><b>'+esc(x.key)+'</b></td><td>'+(x.value==null?'N/A':x.value)+'</td><td>'+esc(x.numerator==null?'-':x.numerator)+'</td><td>'+esc(x.denominator==null?'-':x.denominator)+'</td><td>'+esc(x.target)+'</td><td>'+esc(x.weight)+'%</td><td>'+esc(x.source)+'<br><span class="metricMeta">'+esc(x.formula)+'</span></td><td>'+badge(x.dataQualityStatus)+'</td></tr>').join('')+'</tbody></table></div></section>'}catch(e){body.className='error';body.textContent=e.message||e}}}
async function renderOnboarding(){const accepted=await call('adminRecruitmentList',{status:'OFFER_ACCEPTED',limit:100}),started=await call('adminRecruitmentList',{status:'PRE_ONBOARDING',limit:100}),rows=accepted.rows.concat(started.rows);if(!rows.length){app.className='empty';app.textContent='ไม่มีผู้รอ Onboarding';return}app.className='tableWrap';app.innerHTML='<table><thead><tr><th>ผู้สมัคร</th><th>ตำแหน่ง</th><th>สาขา</th><th>สถานะ</th><th></th></tr></thead><tbody>'+rows.map(x=>'<tr><td><b>'+esc(x.name)+'</b><br><span class="metricMeta">'+esc(x.applicantId)+'</span></td><td>'+esc(x.positionCode)+'</td><td>'+esc(x.branchCode)+'</td><td>'+badge(x.status)+'</td><td>'+(x.status==='OFFER_ACCEPTED'?'<button class="btn small primary" data-onboard="'+esc(x.applicantId)+'">เริ่ม Onboarding</button>':'กรอกข้อมูลส่วนที่เหลือใน Employee Registration')+'</td></tr>').join('')+'</tbody></table>';app.querySelectorAll('[data-onboard]').forEach(b=>b.onclick=async()=>{if(!confirm('สร้าง Draft Onboarding โดยใช้ข้อมูลเดิมของผู้สมัคร?'))return;b.disabled=true;try{await call('adminStartOnboarding',{applicantId:b.dataset.onboard});await renderOnboarding()}catch(e){alert(e.message||e)}finally{b.disabled=false}})}
async function renderInterviews(){const r=await call('adminGetInterviews');if(!r.rows.length){app.className='empty';app.innerHTML='<b>ยังไม่มีนัดสัมภาษณ์</b><div class="formula">สร้างผ่าน adminSaveInterview จากผู้สมัครสถานะ SCREENING</div>';return}app.className='tableWrap';app.innerHTML='<table><thead><tr><th>ผู้สมัคร</th><th>วันที่/เวลา</th><th>สถานที่</th><th>ผู้สัมภาษณ์</th><th>สถานะ</th><th>ผล</th></tr></thead><tbody>'+r.rows.map(x=>'<tr><td><b>'+esc(x.name)+'</b><br><span class="metricMeta">'+esc(x.applicantId)+'</span></td><td>'+esc(x.date)+' '+esc(x.time)+'</td><td>'+esc(x.branchCode)+' • '+esc(x.location)+'</td><td>'+esc(x.interviewerId||'-')+'</td><td>'+badge(x.status)+'</td><td>'+badge(x.result||'-')+'</td></tr>').join('')+'</tbody></table>'}
function renderUnavailable(){const flag={activity:'ACTIVITY_ENABLED',performance:'PERFORMANCE_ENABLED',retention:'OFFBOARDING_ENABLED'}[view],enabled=flag&&bootstrap.flags[flag];app.className='notice';app.innerHTML='<b>'+(enabled?'โมดูลเปิดแล้ว แต่หน้ารายละเอียดยังอยู่ระหว่างเชื่อม API':'ยังไม่เปิดใช้งานใน environment นี้')+'</b><div class="formula">ไม่แสดงข้อมูลจำลอง • '+esc(flag||'module API ยังไม่ครบ')+'</div>'}
async function start(){token=getToken();if(!token&&parent!==window){parent.postMessage({type:'KruaFlowAdminSessionRequest'},location.origin);await new Promise(r=>setTimeout(r,350));token=getToken()}if(!token){app.className='error';app.innerHTML='ไม่พบ Admin session กรุณาเปิดผ่าน <a href="./workspace.html'+(isStaging?'?staging=1':'')+'">Workspace</a>';return}bootstrap=await call('workforceBootstrap');if(!bootstrap.ready){app.className='notice';app.innerHTML='<b>Workforce V2 schema ยังไม่ถูกสร้าง</b><div class="formula">ให้ Admin รัน adminWorkforceMigrate แบบ dry-run ก่อน และ apply เฉพาะเมื่อ review แผนแล้ว</div>';return}if(!bootstrap.flags.WORKFORCE_V2_ENABLED){app.className='notice';app.innerHTML='<b>WORKFORCE_V2_ENABLED ยังปิดอยู่</b><div class="formula">โครงสร้างพร้อม แต่ UI ถูก feature-gate เพื่อไม่กระทบระบบเดิม</div>';return}if(view==='dashboard')return renderDashboard();if(view==='applicants')return renderApplicants();if(view==='interviews')return renderInterviews();if(view==='onboarding')return renderOnboarding();if(view==='work-queue')return renderQueue();if(view==='staffing')return renderStaffing();if(view==='activity')return renderActivity();if(view==='attendance')return renderAttendance();if(view==='reports')return renderReports('recruitment');if(view==='retention')return renderReports('retention');if(view==='payroll-period')return renderPayrollPeriods();if(view==='notifications')return renderNotifications();if(view==='offboarding')return renderExits();if(view==='performance')return renderPerformance();return renderUnavailable()}
window.addEventListener('message',e=>{if(e.origin!==location.origin)return;const m=e.data||{};if(m.type==='KruaFlowAdminSession'&&m.token){sessionStorage.setItem(SS,m.token);token=m.token}});start().catch(error);
})();
</script></body></html>
